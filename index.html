 beats:[
 {say:'<b>Порт</b> — число от 0 до 65535 в заголовке транспортного уровня. По нему система отдаёт данные нужной программе. Каждый пакет несёт два порта: отправителя и получателя.',what:'Показаны программы и их порты.',who:'Приложения телефона, службы сервера.',ch:'Видно, что у каждой программы свой порт.',w:['Порт','номер от 0 до 65535, по которому операционная система определяет программу-получателя.'],act:async()=>{actv('taxi','web');draw();await wait(400);}},
 {say:'Службы на серверах слушают <b>известные порты</b>: веб — 443 (HTTPS) и 80 (HTTP), удалённый доступ SSH — 22, отправка почты — 587, DNS — 53. Клиенту порт выдаёт система — случайный, из диапазона 49152–65535.',what:'RideNow связался с портом 443.',who:'RideNow → веб-сервер.',ch:'Запрос попал к нужной службе.',w:['Известные порты','номера 0–1023, закреплённые за стандартными службами.'],act:async()=>{reset2();draw();await walk(['taxi','net','web'],{label:':52314 → :443'});mark('web','ok','это мне');draw();}},
 {say:'Пара «IP-адрес + порт» называется <b>сокетом</b>. А соединение однозначно задаётся пятью значениями: протокол, IP и порт отправителя, IP и порт получателя. Поэтому два приложения могут одновременно обращаться к одному серверу.',what:'Показаны два соединения к одному серверу.',who:'RideNow и мессенджер → веб-сервер.',ch:'Видно, чем различаются соединения.',w:['Сокет','пара «IP-адрес : порт» — конечная точка соединения.'],act:async()=>{reset2();tbl('conn',260,14,400,'Соединения телефона',[['TCP','.23:52314 → .7.44:443'],['TCP','.23:52320 → .7.44:443']],[70,330]);draw();await Promise.all([walk(['taxi','net','web'],{label:':52314'}),walk(['chat','net','web'],{label:':52320'})]);await walk(['web','net','chat'],{kind:'resp',label:'→ :52320'});mark('chat','ok','ответ мне');draw();}},
 {say:'Если пакет пришёл на порт, который никто не слушает, система отвечает отказом. Так сканеры и узнают, какие службы запущены. Посмотреть свои соединения и открытые порты можно командой <b>netstat</b> или <b>ss</b>.',what:'Пакет на закрытый порт отклонён.',who:'Сервер.',ch:'Понятно, что такое закрытый порт.',pro:'netstat -an в Windows и macOS, ss -tunap в Linux. Строки LISTEN — порты, которые ждут подключений; ESTABLISHED — установленные соединения.',act:async()=>{reset2();draw();await walk(['mail','net','ssh'],{kind:'bad',label:'→ :3306 ?'});boom('ssh');mark('ssh','bad','порт закрыт');draw();}}],

LS.m7l2={mod:7,t:'TCP',goals:['Понять, как TCP гарантирует доставку','Разобрать рукопожатие и номера последовательности','Увидеть повторную передачу при потере'],
 task:['Пакеты теряются. Как не потерять заказ?','По пути пакет может потеряться, прийти дважды или обогнать предыдущий. А заказ такси должен дойти целиком и по порядку.','Как получить надёжную доставку поверх ненадёжной сети?'],
 idea:['Заказное письмо с описью','Вы отправляете документы по страницам. Каждая пронумерована, получатель подтверждает: «получил по 5-ю включительно». Если подтверждение не пришло — страницу отправляют снова. Перед отправкой стороны созваниваются: «готов принимать?» — «готов».','На схеме телефон, сеть и сервер RideNow.'],
 scene:{nodes:{phone:nd(110,300,'phone','Телефон','.23:52314'),net:nd(450,300,'globe','Интернет'),srv:nd(790,300,'server','RideNow','104.21.7.44:443')},
  links:[lk('phone','net','air'),lk('net','srv','fiber')],zones:[]},
 beats:[
 {say:'<b>TCP</b> сначала устанавливает соединение — <b>тройное рукопожатие</b>. Телефон: SYN — «хочу соединиться». Сервер: SYN-ACK — «согласен». Телефон: ACK — «принято». Теперь обе стороны готовы.',what:'Соединение установлено.',who:'Телефон и сервер.',ch:'Стороны договорились о соединении.',w:['Тройное рукопожатие','обмен SYN → SYN-ACK → ACK, устанавливающий TCP-соединение.'],act:async()=>{reset2();draw();await walk(['phone','net','srv'],{label:'SYN'});await walk(['srv','net','phone'],{kind:'resp',label:'SYN-ACK'});await walk(['phone','net','srv'],{label:'ACK'});mark('srv','ok','соединение открыто');mark('phone','ok','соединение открыто');draw();}},
 {say:'Каждый байт данных пронумерован. Телефон отправляет 400 байт заказа, начиная с номера 1001. Сервер подтверждает: <b>ACK 1401</b> — «получил всё до 1400, жду 1401».',what:'Данные доставлены и подтверждены.',who:'Телефон → сервер → телефон.',ch:'Видно, как работают номера последовательности.',w:['Номер последовательности','номер первого байта сегмента; по нему получатель собирает данные по порядку.'],act:async()=>{reset2();tbl('seq',300,20,300,'Счётчики TCP',[['отправлено','1001–1400'],['подтверждено','—']],[150,150]);draw();await walk(['phone','net','srv'],{label:'seq 1001, 400 байт'});tbl('seq',300,20,300,'Счётчики TCP',[['отправлено','1001–1400'],['подтверждено','до 1400']],[150,150],[1]);await walk(['srv','net','phone'],{kind:'resp',label:'ACK 1401'});mark('phone','ok','доставлено');draw();}},
 {say:'Следующий сегмент потерялся по дороге. Подтверждения нет. Телефон ждёт заданное время и отправляет сегмент повторно. Приложение ничего не замечает — разве что небольшую задержку.',what:'Потерянный сегмент отправлен повторно.',who:'Телефон и сервер.',ch:'Данные дошли, несмотря на потерю.',w:['Повторная передача','повторная отправка сегмента, если подтверждение не пришло вовремя.'],act:async()=>{reset2();draw();await moveFrame('phone','net',{label:'seq 1401',corruptAt:.8});boom('net');mark('net','bad','потерян');draw();await wait(800);clearMarks();mark('phone','info','нет ACK — повторяю');draw();await walk(['phone','net','srv'],{label:'seq 1401 (повтор)'});await walk(['srv','net','phone'],{kind:'resp',label:'ACK 1801'});mark('phone','ok','доставлено');draw();}},
 {say:'Ждать подтверждения каждого сегмента долго. Поэтому TCP отправляет сразу несколько — сколько позволяет <b>окно</b>. Если сеть начинает терять пакеты, окно уменьшается: так TCP не перегружает сеть. В конце соединение закрывается обменом FIN.',what:'Объяснены окно и закрытие.',who:'—',ch:'Понятно, как TCP регулирует скорость.',w:['Окно TCP','сколько байт можно отправить без подтверждения; регулирует скорость передачи.'],pro:'Сегмент TCP в обычном Ethernet переносит до 1460 байт данных (MSS): 1500 байт MTU минус 20 байт IP и 20 байт TCP.',act:async()=>{reset2();draw();await Promise.all([walk(['phone','net','srv'],{label:'seq 1801'}),(async()=>{await wait(250);await walk(['phone','net','srv'],{label:'seq 3261'});})(),(async()=>{await wait(500);await walk(['phone','net','srv'],{label:'seq 4721'});})()]);await walk(['srv','net','phone'],{kind:'resp',label:'ACK 6181'});await walk(['phone','net','srv'],{label:'FIN'});mark('srv','info','закрываем');draw();}}],
 theory:{sec:[
 ['Что гарантирует TCP','Все данные дойдут, без пропусков и дублей, в том порядке, в котором отправлены. Если доставить невозможно, приложение узнает об ошибке.'],
 ['Рукопожатие','SYN → SYN-ACK → ACK. Стороны сообщают друг другу начальные номера последовательности. Это стоит одного «круга» туда-обратно до начала передачи.'],
 ['Подтверждения и повторы','Получатель сообщает номер следующего ожидаемого байта. Неподтверждённые данные отправляются повторно по таймеру или после трёх одинаковых ACK.'],
 ['Управление скоростью','Окно получателя защищает его от переполнения. Окно перегрузки защищает сеть: растёт, пока всё доходит, и уменьшается при потерях.']],
 ex:['Обмен',['SYN seq=1000','SYN-ACK seq=5000 ack=1001','ACK ack=5001','данные seq=1001 (400 байт) → ACK 1401']]},
 prac:[{t:'order',q:'Расставьте сообщения рукопожатия',o:['SYN','SYN-ACK','ACK'],ex:'Запрос, согласие, подтверждение.'},
 {t:'input',q:'Отправлено 400 байт, начиная с номера 1001. Какой номер будет в ACK?',a:['1401'],hint:'Номер следующего ожидаемого байта.',ex:'1001 + 400 = 1401.'},
 {t:'input',q:'MTU 1500 байт, заголовки IP и TCP по 20 байт. Сколько байт данных влезет в один сегмент?',a:['1460'],hint:'1500 − 20 − 20.',ex:'Это MSS.'},
 {t:'choice',q:'Подтверждение на сегмент не пришло. Что сделает TCP?',o:['Сообщит приложению об ошибке сразу','Отправит сегмент повторно','Закроет соединение'],a:1,ex:'Повторная передача.'},
 {t:'choice',q:'Сеть начала терять пакеты. Что произойдёт с окном TCP?',o:['Увеличится','Уменьшится','Не изменится'],a:1,ex:'TCP снижает скорость, чтобы не усугублять перегрузку.'}],
 check:[{q:'Первое сообщение рукопожатия?',o:['SYN','ACK','FIN'],a:0,ex:'SYN — синхронизация.'},
 {q:'Что означает ACK 1401?',o:['Получено всё до 1400, жду 1401','Получен байт 1401','Ошибка'],a:0,ex:'Подтверждение — номер следующего байта.'},
 {q:'Что делает TCP при потере сегмента?',o:['Отправляет повторно','Игнорирует','Перезагружает сервер'],a:0,ex:'Надёжность — его главная задача.'},
 {q:'Зачем нужно окно?',o:['Регулировать скорость и не ждать ACK на каждый сегмент','Шифровать','Выбирать маршрут'],a:0,ex:'Окно растёт и сжимается.'},
 {q:'Как закрывается соединение?',o:['Обменом FIN','Обменом SYN','Само по себе'],a:0,ex:'Каждая сторона отправляет FIN и подтверждает чужой.'}],
 memes:{idea:[TWO('headset',0,'headset',0),'Алло, готов?','готов, а ты?'],done:[ONE('letter'),'ACK не пришёл','отправлю ещё раз']}};

LS.m7l3={mod:7,t:'UDP и QUIC',goals:['Понять, когда надёжность мешает','Разобраться, где используется UDP','Узнать, зачем придумали QUIC и HTTP/3'],
 task:['А если опоздавший пакет уже не нужен?','Во время звонка водителю пакет с голосом потерялся. Если TCP пришлёт его повторно через полсекунды, он будет уже бесполезен — разговор ушёл вперёд.','Как передавать данные, когда скорость важнее полноты?'],
 idea:['Прямой эфир','Телевизор в прямом эфире не просит повторить пропущенный кадр — он показывает следующий. Небольшая рябь лучше, чем пауза. UDP работает так же: отправил и забыл.','На схеме телефон пассажира, сеть и телефон водителя во время звонка.'],
 scene:{nodes:{phone:nd(110,300,'phone','Пассажир'),net:nd(450,300,'globe','Интернет'),drv:nd(790,300,'phone','Водитель')},
  links:[lk('phone','net','air'),lk('net','drv','air')],zones:[]},
 beats:[
 {say:'<b>UDP</b> — простой протокол: без рукопожатия, без подтверждений, без повторов. Заголовок всего 8 байт: два порта, длина и контрольная сумма. Пакет отправлен — и всё.',what:'Голос идёт пакетами UDP.',who:'Пассажир → водитель.',ch:'Видно, что UDP не ждёт подтверждений.',w:['UDP','User Datagram Protocol: транспорт без установки соединения и гарантий доставки.'],act:async()=>{reset2();draw();for(let i=1;i<=3;i++){await walk(['phone','net','drv'],{label:'голос #'+i,dur:500});}mark('drv','ok','слышу');draw();}},
 {say:'Пакет №5 потерялся. UDP не повторяет его: приложение просто сглаживает пропуск — вы слышите короткий щелчок, но разговор не замирает. Для звонка это лучше, чем ждать.',what:'Потеря не остановила поток.',who:'Пассажир → водитель.',ch:'Понятно, почему звонкам не нужен TCP.',act:async()=>{reset2();draw();await walk(['phone','net','drv'],{label:'голос #4',dur:500});await moveFrame('phone','net',{label:'голос #5',corruptAt:.8,dur:500});boom('net');await walk(['phone','net','drv'],{label:'голос #6',dur:500});mark('drv','info','щелчок — и дальше');draw();}},
 {say:'UDP используют там, где важна скорость: <b>DNS</b> (один вопрос — один ответ), звонки и видеосвязь, онлайн-игры, трансляции, DHCP. Если надёжность нужна, приложение реализует её само — поверх UDP.',what:'Названы области применения UDP.',who:'—',ch:'Понятно, где встречается UDP.',act:async()=>{reset2();mark('phone','info','DNS, звонки, игры');draw();await wait(300);}},
 {say:'Так появился <b>QUIC</b> — протокол поверх UDP, на котором работает <b>HTTP/3</b>. Он надёжен, как TCP, но быстрее устанавливает соединение (сразу вместе с шифрованием) и не стопорит все потоки из-за одного потерянного пакета.',what:'Объяснён QUIC.',who:'—',ch:'Понятно, почему современный веб переходит на UDP.',w:['QUIC','транспортный протокол поверх UDP со встроенным шифрованием и надёжной доставкой; основа HTTP/3.'],pro:'В TCP потеря одного сегмента задерживает все данные за ним — блокировка начала очереди (head-of-line blocking). В QUIC потоки независимы: потеря в одном не тормозит остальные.',act:async()=>{reset2();draw();await walk(['phone','net','drv'],{label:'QUIC: привет + ключи'});await walk(['drv','net','phone'],{kind:'resp',label:'готово, шифруем'});mark('phone','ok','1 круг вместо 2–3');draw();}}],
 theory:{sec:[
 ['UDP','Без соединения, без подтверждений, без порядка. Заголовок 8 байт. Минимальная задержка: данные отправляются сразу.'],
 ['Где UDP','DNS, DHCP, голос и видео (RTP), онлайн-игры, потоковое вещание, VPN (WireGuard), QUIC.'],
 ['TCP или UDP','TCP — когда важна каждая буква: веб, почта, файлы, заказ. UDP — когда важна свежесть данных: голос, видео, координаты в игре.'],
 ['QUIC и HTTP/3','QUIC берёт UDP как основу и добавляет надёжность, шифрование TLS 1.3 и независимые потоки. Им пользуются крупные сайты и мобильные приложения.']],
 ex:['Заголовок UDP — 8 байт',['порт отправителя  2 байта','порт получателя   2 байта','длина             2 байта','контрольная сумма 2 байта']]},

 {t:'input',q:'Сколько байт занимает заголовок UDP?',a:['8'],hint:'Четыре поля по 2 байта.',ex:'8 байт против минимум 20 у TCP.'},

LS.m8l1={mod:8,t:'HTTP',goals:['Понять устройство HTTP-запроса и ответа','Знать основные методы и коды ответа','Понять, как сервер узнаёт пользователя'],
 task:['О чём телефон говорит с сервером?','Соединение установлено, порт 443 открыт. Теперь приложению надо сказать: «Создай поездку от дома до работы».','На каком языке приложения разговаривают с серверами?'],
 idea:['Окно в учреждении','Вы подаёте в окно заявление по форме: что хотите сделать, с чем, и прикладываете документы. Вам возвращают ответ со штампом: «принято», «не найдено», «ошибка на нашей стороне». HTTP — такая форма заявления и такие штампы.','На схеме приложение RideNow и сервер API.'],
 scene:{nodes:{phone:nd(110,320,'phone','RideNow'),net:nd(450,320,'globe','Интернет'),srv:nd(790,320,'server','api.ridenow.com')},
  links:[lk('phone','net','air'),lk('net','srv','fiber')],zones:[]},
 beats:[
 {say:'<b>HTTP</b> — протокол прикладного уровня. Запрос — это текст: <b>метод</b> (что сделать), <b>путь</b> (с чем), <b>заголовки</b> (служебные сведения) и <b>тело</b> (данные). Приложение отправляет: POST /rides с адресами в теле.',what:'Отправлен HTTP-запрос.',who:'RideNow → сервер.',ch:'Видно, из чего состоит запрос.',w:['HTTP','HyperText Transfer Protocol: протокол запросов и ответов между клиентом и сервером.'],act:async()=>{reset2();note('phone',['POST /rides HTTP/1.1','Host: api.ridenow.com','Authorization: Bearer eyJ…','','{"from":"Дом","to":"Работа"}'],'info','top',true);draw();await walk(['phone','net','srv'],{label:'POST /rides'});mark('srv','info','разбираю запрос');draw();}},
 {say:'Сервер отвечает <b>кодом состояния</b> и телом. 201 Created — «поездка создана», в теле — её номер и цена. Коды делятся на классы по первой цифре.',what:'Получен ответ 201.',who:'Сервер → RideNow.',ch:'Поездка создана.',w:['Код состояния','трёхзначное число в ответе HTTP: 2xx — успех, 3xx — перенаправление, 4xx — ошибка клиента, 5xx — ошибка сервера.'],act:async()=>{reset2();tbl('codes',280,20,340,'Классы кодов',[['2xx','успех'],['3xx','перенаправление'],['4xx','ошибка клиента'],['5xx','ошибка сервера']],[80,260],[0]);draw();await walk(['srv','net','phone'],{kind:'resp',label:'201 Created'});note('phone',['HTTP/1.1 201 Created','{"id":7781,"price":420}'],'ok','top',true);mark('phone','ok','поездка создана');draw();}},
 {say:'Приложение запрашивает поездку с несуществующим номером: GET /rides/999. Ответ — <b>404 Not Found</b>. А если сервер упал на обработке — 500 Internal Server Error. Первая цифра сразу говорит, кто виноват.',what:'Получен ответ 404.',who:'RideNow и сервер.',ch:'Понятно, как читать ошибки.',act:async()=>{reset2();TB('codes').hl=[2];draw();await walk(['phone','net','srv'],{label:'GET /rides/999'});await walk(['srv','net','phone'],{kind:'bad',label:'404 Not Found'});mark('phone','bad','нет такой поездки');draw();}},
 {say:'HTTP не помнит предыдущих запросов: каждый запрос — сам по себе. Чтобы сервер узнал пользователя, приложение в каждом запросе передаёт <b>токен</b> в заголовке Authorization, а браузер — <b>cookie</b>.',what:'Объяснена авторизация.',who:'—',ch:'Понятно, как сервер узнаёт вас.',w:['Cookie и токен','строки, которые клиент прикладывает к каждому запросу, чтобы сервер узнал пользователя или сессию.'],pro:'HTTP/1.1 — текстовый, по одному запросу за раз в соединении. HTTP/2 — двоичный, много параллельных запросов в одном TCP-соединении. HTTP/3 — то же поверх QUIC.',act:async()=>{reset2();draw();await walk(['phone','net','srv'],{label:'GET /me + токен'});await walk(['srv','net','phone'],{kind:'resp',label:'200 OK: Анна'});mark('phone','ok','узнали');draw();}}],
 theory:{sec:[
 ['Методы','GET — получить. POST — создать. PUT и PATCH — изменить. DELETE — удалить. Сервер сам решает, что значит метод для конкретного пути.'],
 ['Частые коды','200 OK, 201 Created, 301 Moved Permanently, 304 Not Modified, 400 Bad Request, 401 Unauthorized, 403 Forbidden, 404 Not Found, 429 Too Many Requests, 500, 502 Bad Gateway, 503 Service Unavailable.'],
 ['Заголовки','Host — какой сайт. Content-Type — формат тела (JSON, HTML). Authorization — токен. Cookie — сессия браузера. Cache-Control — правила кэширования.'],

LS.m8l2={mod:8,t:'TLS и HTTPS',goals:['Понять, от чего защищает шифрование','Разобрать рукопожатие TLS','Понять роль сертификата'],

 idea:['Сейф с открытым замком','Сервер раздаёт всем открытые замки, а ключ держит у себя. Вы кладёте секрет в коробку и защёлкиваете замок — открыть его сможет только сервер. А нотариус заранее заверил, что замок действительно принадлежит RideNow.','На схеме телефон, провайдер, который «подсматривает», сервер и удостоверяющий центр.'],
 scene:{nodes:{phone:nd(110,320,'phone','RideNow'),isp:nd(450,320,'globe','Провайдер','видит трафик'),srv:nd(790,320,'server','api.ridenow.com'),ca:nd(790,100,'shield','Удостоверяющий центр')},
  links:[lk('phone','isp','air'),lk('isp','srv','fiber'),lk('ca','srv','air')],zones:[]},
 beats:[
 {say:'Без шифрования провайдер, владелец Wi-Fi или кто угодно на пути видит содержимое запросов. <b>HTTPS</b> — это HTTP внутри защищённого канала <b>TLS</b>. Канал создаётся до первого HTTP-запроса.',what:'Незашифрованный запрос виден посредникам.',who:'Телефон, провайдер, сервер.',ch:'Видна проблема открытого трафика.',w:['TLS','Transport Layer Security: протокол шифрования и проверки подлинности сервера поверх TCP.'],act:async()=>{reset2();draw();await walk(['phone','isp'],{kind:'bad',label:'пароль: 12345'});mark('isp','bad','всё вижу');await moveFrame('isp','srv',{kind:'bad',label:'пароль: 12345'});draw();}},
 {say:'Телефон начинает рукопожатие: <b>ClientHello</b> — «умею такие шифры, вот мой временный ключ». Сервер отвечает ServerHello со своим ключом и присылает <b>сертификат</b>.',what:'Обмен приветствиями и сертификатом.',who:'Телефон и сервер.',ch:'Телефон получил сертификат.',w:['Сертификат','документ с открытым ключом сервера и его именем, подписанный удостоверяющим центром.'],act:async()=>{reset2();draw();await walk(['phone','isp','srv'],{label:'ClientHello'});await walk(['srv','isp','phone'],{kind:'resp',label:'ServerHello + сертификат'});mark('phone','info','проверяю сертификат');draw();}},
 {say:'Телефон проверяет: сертификат выдан на api.ridenow.com, не просрочен и подписан <b>удостоверяющим центром</b>, которому доверяет система. Список таких центров встроен в телефон. Подделать подпись без ключа центра невозможно.',what:'Сертификат проверен.',who:'Телефон и удостоверяющий центр.',ch:'Телефон уверен, что говорит именно с RideNow.',w:['Удостоверяющий центр (CA)','организация, которая подписывает сертификаты; её корневой сертификат встроен в систему.'],act:async()=>{reset2();mark('ca','ok','подпись моя');mark('phone','ok','сервер настоящий');draw();await wait(400);}},
 {say:'Из временных ключей обе стороны независимо вычисляют один общий секрет — по алгоритму <b>Диффи — Хеллмана</b>. Сам секрет по сети не передаётся. Дальше весь HTTP идёт зашифрованным: провайдер видит только поток неразборчивых байтов.',what:'Данные идут в зашифрованном виде.',who:'Телефон, провайдер, сервер.',ch:'Посредник больше ничего не может прочитать.',w:['Обмен ключами','способ получить общий секрет, не передавая его по сети (Диффи — Хеллман).'],act:async()=>{reset2();draw();await walk(['phone','isp','srv'],{label:'a7 f3 0c 9e …'});mark('isp','info','вижу только шум');mark('srv','ok','POST /rides');draw();}},
 {say:'Что всё же остаётся видимым: IP-адреса, порты, объём и время трафика и имя сайта в ClientHello (<b>SNI</b>). Провайдер знает, что вы обращаетесь к api.ridenow.com, но не знает, куда вы едете.',what:'Показано, что видно посреднику.',who:'Провайдер.',ch:'Понятны границы защиты.',pro:'TLS 1.3 устанавливает канал за один круг туда-обратно. Расширение ECH шифрует и SNI, но пока поддерживается не везде. Ошибка сертификата в браузере — повод остановиться, а не нажимать «Всё равно перейти».',act:async()=>{reset2();mark('isp','info','IP, порт 443, SNI, объём');draw();await wait(300);}}],

 task:['Один сервер на миллион пассажиров?','Утром тысячи людей одновременно заказывают такси. Один компьютер такую нагрузку не выдержит, а если он сломается — сервис встанет.','Как устроен сервис, который не падает?'],
 idea:['Ресторан изнутри','На входе — администратор: проверяет гостей и рассаживает по свободным официантам. Официантов несколько: один заболел — остальные подхватят. Кухня и склад — общие. Гость видит один ресторан, хотя внутри работают десятки людей.','На схеме — CDN, firewall, балансировщик, три сервера приложения и база данных.'],
 scene:{nodes:{phone:nd(70,280,'phone','RideNow'),cdn:nd(220,280,'globe','CDN','рядом с вами'),fw:nd(370,280,'shield','Firewall'),lb:nd(510,280,'split','Балансировщик','104.21.7.44'),a:nd(680,110,'server','Сервер A'),b:nd(680,280,'server','Сервер B'),c:nd(680,410,'server','Сервер C'),db:nd(840,280,'db','База данных')},

 beats:[
 {say:'Адрес 104.21.7.44 принадлежит не одному компьютеру, а целой системе. Первой запрос встречает <b>CDN</b> — сеть серверов по всему миру, которые хранят копии картинок и скриптов рядом с пользователем. Всё, что можно отдать из копии, отдаётся сразу.',what:'Статика отдана из CDN.',who:'Телефон и CDN.',ch:'Карта и иконки пришли с ближайшего узла.',w:['CDN','сеть распределённых серверов, которые отдают копии файлов с ближайшего к пользователю узла.'],act:async()=>{reset2();draw();await moveFrame('phone','cdn',{label:'GET /map.png'});await moveFrame('cdn','phone',{kind:'resp',label:'200 из кэша'});mark('cdn','ok','копия рядом');draw();}},
 {say:'Запрос на создание поездки проходит firewall и попадает на <b>балансировщик нагрузки</b>. Он выбирает наименее загруженный сервер приложения и передаёт запрос ему. Балансировщик работает как <b>обратный прокси</b>: клиент говорит только с ним.',what:'Запрос попал на сервер B.',who:'CDN → firewall → балансировщик → сервер B.',ch:'Нагрузка распределена.',w:['Балансировщик нагрузки','устройство или программа, распределяющая запросы между несколькими серверами.'],act:async()=>{reset2();draw();await walk(['phone','cdn','fw','lb'],{label:'POST /rides',dur:800});await moveFrame('lb','b',{label:'тебе'});await moveFrame('b','db',{label:'INSERT'});await moveFrame('db','b',{kind:'resp',label:'ок'});await walk(['b','lb','fw','cdn','phone'],{kind:'resp',label:'201',dur:700});mark('phone','ok','создано');draw();}},
 {say:'Балансировщик каждые несколько секунд опрашивает серверы: «живой?» — это <b>проверка здоровья</b>. Сервер B перестал отвечать. Балансировщик исключает его, и новые запросы идут на A и C. Пользователи ничего не замечают.',what:'Сервер B исключён, нагрузка ушла на A и C.',who:'Балансировщик и серверы.',ch:'Сервис пережил отказ сервера.',w:['Проверка здоровья','регулярный запрос балансировщика к серверу; не ответил — сервер выводится из работы.'],act:async()=>{reset2();draw();await Promise.all([moveFrame('lb','a',{label:'живой?',dur:700}),moveFrame('lb','b',{label:'живой?',dur:700}),moveFrame('lb','c',{label:'живой?',dur:700})]);boom('b');mark('b','bad','не отвечает');draw();await moveFrame('lb','a',{label:'POST /rides'});mark('a','ok','принял');await moveFrame('lb','c',{label:'POST /rides'});mark('c','ok','принял');draw();}},
 {say:'Чтобы видеть машину на карте в реальном времени, приложение открывает <b>WebSocket</b> — постоянное двустороннее соединение. Теперь сервер сам присылает координаты водителя, не дожидаясь запроса.',what:'Сервер шлёт обновления по WebSocket.',who:'Сервер A → телефон.',ch:'Машина движется на карте.',w:['WebSocket','постоянное двустороннее соединение поверх HTTP: сервер может отправлять данные клиенту в любой момент.'],pro:'В реальности: CDN — Cloudflare или Akamai, балансировщик и обратный прокси — Nginx, HAProxy или облачный LB, база — PostgreSQL, быстрый кэш — Redis.',act:async()=>{reset2();mark('b','bad','на ремонте');draw();await walk(['phone','cdn','fw','lb','a'],{label:'Upgrade: websocket',dur:700});for(let i=0;i<2;i++){await walk(['a','lb','fw','cdn','phone'],{kind:'resp',label:'машина: 300 м',dur:500});}mark('phone','ok','вижу машину');draw();}}],
 theory:{sec:[
 ['Из чего состоит сервис','CDN для статики, firewall и защита от DDoS, балансировщик, несколько серверов приложения, база данных и кэш. Каждое звено можно дублировать.'],

 task:['Ничего не работает. С чего начать?','Звонит друг: «интернет не работает». Это может быть что угодно: кабель, Wi-Fi, адрес, DNS, сайт. Хаотично перебирать — долго.','Как искать поломку системно?'],
 idea:['Этажи здания','Если в квартире на седьмом этаже нет воды, сантехник не начинает с крана. Он идёт снизу: есть ли вода в доме, на этаже, в стояке. Модель OSI — такие этажи сети. Проверяем снизу вверх, и каждый работающий этаж исключает целый класс причин.','Справа — семь уровней модели OSI с протоколами и командами проверки.'],

setSec('m0l1','Кодировка UTF-8','Кодировка UTF-8','В UTF-8 у разных символов разная «ширина». Латинские буквы, цифры, пробел и знаки препинания (в том числе дефис) занимают 1 байт, кириллица и ещё ряд алфавитов — 2, большинство иероглифов — 3, эмодзи — обычно 4. Если программы на двух концах используют разные кодировки, вместо текста появляются «кракозябры»: слово «привет», прочитанное как текст в кодировке Windows-1252, превращается в «Ð¿Ñ€Ð¸Ð²ÐµÑ‚».');
setSec('m0l1','Единицы измерения','Единицы измерения','Размеры считают в байтах: 1 Кбайт ≈ 1000 байт, 1 Мбайт ≈ 1000 Кбайт. Строго говоря, 1000 байт — это 1 кБ (килобайт), а 1024 байта — 1 КиБ (кибибайт); Windows пишет «КБ», но считает по 1024, поэтому цифры бывают чуть разными. Скорость сети — в битах в секунду: 100 Мбит/с — это около 12,5 Мбайт в секунду. «б» в «Мбит» — бит, «Б» в «МБ» — байт. Часть скорости всегда уходит на заголовки пакетов, поэтому файл скачивается чуть медленнее, чем показывает арифметика.');
setSec('m0l2','Задержка и пропускная способность','Задержка и пропускная способность','Задержка — время в пути в миллисекундах, она важна для игр и звонков. Пропускная способность — объём данных в секунду (Мбит/с), она важна для скачивания и видео. Широкий канал может иметь большую задержку: у геостационарного спутника (около 36 000 км над Землёй) при 100 Мбит/с задержка около 600 мс, а у низкоорбитальных спутниковых систем — десятки миллисекунд. Часто измеряют задержку «туда и обратно» (RTT): время от отправки запроса до получения ответа; её показывает команда ping. В одну сторону получается примерно половина.');

LS.m1l1.theory.sec=[
 ['Сетевая карта','Сетевой адаптер есть в каждом устройстве с сетью. Он кодирует биты в сигнал, следит, когда можно передавать, и проверяет пришедшие данные. У ноутбука их обычно два — Ethernet и Wi-Fi, хотя в тонких моделях разъёма для кабеля может не быть: тогда используют переходник.'],
 ['Медь: витая пара','Восемь проводов в четырёх скрученных парах, разъём RJ-45. Сигнал — это разность напряжений между двумя проводами пары. Внешняя помеха наводится на оба провода почти одинаково, и при вычитании она пропадает; скручивание нужно, чтобы оба провода пары были в поле помехи в равной мере. Категория кабеля определяет скорость: Cat5e — до 1 Гбит/с, Cat6 — 10 Гбит/с на коротких отрезках (до 55 м), Cat6a — 10 Гбит/с на полных 100 м. Длина одного сегмента — не более 100 м.'],
 ['Радио: что такое ГГц','Wi-Fi переносит биты радиоволной. У волны есть две связанные характеристики. Частота — сколько колебаний в секунду; 1 ГГц (гигагерц) — миллиард колебаний в секунду. Длина волны — расстояние, которое волна проходит за одно колебание. Связь между ними: длина волны = скорость света ÷ частота. Для 2,4 ГГц это около 12,5 см, для 5 ГГц — 6 см, для 6 ГГц — 5 см. Поэтому «2,4 ГГц» — это частота, а не длина волны и не скорость интернета. Диапазоны Wi-Fi принято называть именно по частоте.'],
 ['Три диапазона Wi-Fi','2,4 ГГц (2400–2483,5 МГц). Длинная волна лучше огибает препятствия и проходит сквозь стены, поэтому сигнал «бьёт» дальше. Но полоса узкая: всего 3 непересекающихся канала по 20 МГц, и её же занимают Bluetooth, микроволновки, радионяни и соседские сети. Итог: больше дальность, меньше скорость, больше помех.\n5 ГГц (примерно 5170–5835 МГц, границы зависят от страны). Полоса шире, каналов по 20 МГц — двадцать с лишним, их можно объединять в 40, 80 и 160 МГц. Помех меньше. Волна короче и сильнее гасится стенами и перекрытиями, поэтому дальность ниже. Часть каналов делится с радарами (DFS): обнаружив радар, роутер обязан освободить канал, и переключение может занять до минуты.\n6 ГГц (5925–7125 МГц). Места ещё больше: в полном виде это 59 каналов по 20 МГц, 14 по 80 МГц или 7 по 160 МГц, а у Wi-Fi 7 появляются каналы по 320 МГц. Старых устройств здесь нет, помех меньше всего, но волна ещё короче, и сквозь стены она проходит хуже всего.'],
 ['Почему 5 и 6 ГГц быстрее — и всегда ли','Скорость зависит не от самой частоты, а от ширины канала и качества сигнала. На 5 и 6 ГГц есть место для широких каналов (80 и 160 МГц) и меньше помех, поэтому скорость выше. Но чем выше частота, тем сильнее сигнал затухает в воздухе и в стенах. Рядом с роутером 5 ГГц обычно быстрее; через две стены или на другом этаже 2,4 ГГц бывает надёжнее. Роутер и устройство сами выбирают скорость по качеству сигнала: чем слабее сигнал, тем ниже скорость.'],
 ['Поколения Wi-Fi и диапазоны','Wi-Fi 4 (802.11n) — 2,4 и 5 ГГц. Wi-Fi 5 (802.11ac) — только 5 ГГц. Wi-Fi 6 (802.11ax) — 2,4 и 5 ГГц. Wi-Fi 6E — тот же Wi-Fi 6 с добавленным диапазоном 6 ГГц («E» — extended). Wi-Fi 7 (802.11be) — 2,4, 5 и 6 ГГц, каналы до 320 МГц. Теоретические максимумы: у Wi-Fi 6 и 6E до 9,6 Гбит/с, у Wi-Fi 7 до 30 Гбит/с. Реальная скорость заметно ниже заявленной: эфир общий, часть времени уходит на служебные данные и ожидание. К сети 6 ГГц устройство подключится, только если поддерживает Wi-Fi 6E или Wi-Fi 7.'],
 ['6 ГГц: правила зависят от страны','Диапазоны Wi-Fi — это радиочастоты, и их использование определяет государство. Во многих странах в 6 ГГц разрешены лишь маломощные устройства внутри помещений. Для сетей 6 ГГц обязателен WPA3 (WPA2 там не работает, а вместо полностью открытой сети используют OWE). В России ГКРЧ в декабре 2022 года разрешила 5,9–6,4 ГГц для Wi-Fi 6E в помещениях, но правила регистрации устройств не были обновлены, и дома этот диапазон почти не работает (данные на начало 2024 года; статус может измениться, проверяйте актуальный). Поэтому у нас дома чаще всего приходится пользоваться 2,4 и 5 ГГц.'],
 ['Что снижает скорость Wi-Fi','Расстояние и стены (особенно бетон, металл, зеркала и вода); соседние сети на том же или соседнем канале; другие устройства в диапазоне 2,4 ГГц (Bluetooth, микроволновка); число устройств: эфир общий, все ждут очереди. Помогает: поставить роутер ближе и выше, использовать 5 ГГц вблизи и 2,4 ГГц вдали, сменить канал, подключить стационарные устройства кабелем.'],
 ['Свет: оптоволокно','Сигнал — вспышки света в стеклянной нити толщиной с волос. По волокну свет идёт со скоростью около 200 000 км/с (две трети скорости света в вакууме). Одномодовое волокно передаёт сотни гигабит (а с уплотнением по длинам волн — терабиты) на десятки километров, многомодовое — на сотни метров внутри зданий. Всё больше домов подключают оптикой прямо в квартиру.']];

setSec('m1l2','Особые адреса','Особые адреса и два служебных бита','Служебные биты лежат в первом байте. Младший (самый правый) бит показывает тип адреса: 0 — адрес одного устройства, 1 — адрес группы устройств. ff:ff:ff:ff:ff:ff — частный случай «всем»: все 48 бит равны единице. Второй справа бит показывает, кто назначил адрес: 0 — производитель (заводской адрес), 1 — назначен локально; так выглядят случайные адреса телефонов. Например, 3c = 0011 1100: второй справа бит равен 0, адрес заводской. 9a = 1001 1010: этот бит равен 1, адрес назначен локально.');

addSec('m2l1','Контрольная сумма',[
 ['Чего нет в этих 1518 байтах','Перед каждым кадром передаются преамбула (7 байт) и признак начала кадра (1 байт): они помогают приёмнику «поймать» синхронизацию, но в размер кадра не входят. Между кадрами выдерживается пауза, равная 12 байтам. Если по одному кабелю идут несколько виртуальных сетей (VLAN), в заголовок добавляется метка в 4 байта, и кадр вырастает до 1522 байт. Бывают и «jumbo-кадры» с данными до 9000 байт, но они работают, только если их поддерживает вся цепочка устройств.'],
 ['Уровни L1, L2, L3…','В схемах сетей часто пишут L1–L7: это уровни модели OSI. L1 — физический (биты, сигнал), L2 — канальный (кадры и MAC-адреса, этот модуль), L3 — сетевой (IP-пакеты, модуль 3), L4 — транспортный (порты, TCP и UDP, модуль 7), L7 — прикладной (HTTP, DNS и другие протоколы программ). Подробно вся модель разбирается в модуле 9; пока достаточно помнить: чем больше номер, тем ближе уровень к приложению.']]);
addQ('m2l1','prac',{t:'input',q:'Какой минимальный размер кадра Ethernet в байтах (заголовок, данные и FCS)?',a:['64'],hint:'14 + 46 + 4.',ex:'14 + 46 + 4 = 64 байта. Если данных меньше 46 байт, их дополняют нулями.'});
setSec('m2l2','Коммутатор','Коммутатор','Работает на канальном уровне (L2): читает MAC-адреса. Учится по адресам отправителей, пересылает кадр только в нужный порт, а неизвестным и широковещательным — во все остальные. У каждого порта свой отдельный участок сети, передача идёт в обе стороны одновременно (полный дуплекс), поэтому коллизий нет, а разные пары компьютеров могут разговаривать одновременно.');
setSec('m2l2','Таблица MAC-адресов','Таблица MAC-адресов','Записи живут около 5 минут без активности (значение зависит от устройства). Если устройство переключили в другой порт, запись обновится при первом же его кадре. Размер таблицы ограничен (обычно тысячи записей): если её переполнить (так устроена атака MAC flooding), коммутатор начинает рассылать кадры во все порты, как концентратор, и их можно подслушать.');
addSec('m2l2','Для специалиста: VLAN',[['Петли в сети','Если соединить коммутаторы кольцом, широковещательный кадр побежит по кругу и размножится, пока не займёт всю полосу: в заголовке Ethernet нет поля TTL (такое поле есть у IP-пакета, вы увидите его в модуле 5). От петель защищает протокол STP: он блокирует лишние порты и оставляет в сети «дорогу» без колец.']]);
setSec('m2l3','SSID и подключение','SSID и подключение','SSID — имя сети. Чтобы подключиться, устройство проходит проверку пароля (WPA2 или WPA3), после чего трафик в эфире шифруется. В открытой сети без пароля (например, в кафе) кадры идут без шифрования, и их может прочитать любое устройство рядом. Даже в сети с общим паролем WPA2 участник, знающий пароль, может расшифровать чужой трафик, если перехватит момент подключения. WPA3 даёт каждому устройству свой ключ, поэтому так подслушать сложнее.');
setSec('m2l3','Общий эфир и очередь','Общий эфир и очередь','На одном канале в каждый момент передаёт одно устройство: Wi-Fi — полудуплекс, приём и передача идут по очереди. Перед передачей устройство «слушает» эфир и ждёт тишины, затем выжидает случайную паузу — так снижается число столкновений (метод называется CSMA/CA). Медленное устройство занимает эфир дольше: старый телефон на низкой скорости задерживает всех остальных.');
setSec('m2l3','Каналы и соседи','Каналы и соседи','Канал — участок диапазона шириной 20 МГц (или больше). Соседские сети на том же канале делят с вами эфир. В диапазоне 2,4 ГГц (2400–2483,5 МГц) центры каналов стоят через 5 МГц, а сам канал занимает 20 МГц, поэтому соседние каналы перекрываются. Не мешают друг другу только каналы 1, 6 и 11 — их всего три. В США разрешены каналы 1–11, в Европе 1–13. В диапазонах 5 и 6 ГГц каналов по 20 МГц намного больше, их можно объединять в 40, 80 и 160 МГц (у Wi-Fi 7 в 6 ГГц — ещё и 320 МГц): канал шире — скорость выше, но влезает меньше каналов и выше шанс пересечься с соседом.');
addQ('m2l3','prac',{t:'choice',q:'Ваша сеть на канале 1 (2,4 ГГц), у соседа — на канале 3. Мешают ли они друг другу?',o:['Да, каналы пересекаются по частоте','Нет, номера разные','Только ночью'],a:0,ex:'Каналы шириной 20 МГц стоят через 5 МГц, поэтому каналы 1 и 3 перекрываются. Без помех — только 1, 6 и 11.'});

addSec('m3l1','Маска и префикс',[['Маска не только /24','Граница между сетью и устройством может проходить и внутри октета. /25 — 128 адресов (126 для устройств), /26 — 64 (62), /27 — 32 (30), /28 — 16 (14), /30 — 4 (2). Общая формула: 2^(32 − префикс) − 2, где два адреса — адрес сети и широковещательный. В домашних сетях почти всегда /24, а /30 часто берут для связи двух маршрутизаторов.']]);
addQ('m3l1','prac',{t:'input',q:'Сколько адресов можно выдать устройствам в сети /26?',a:['62'],hint:'2^(32 − 26) − 2.',ex:'2⁶ = 64 адреса, минус адрес сети и широковещательный — 62.'});
getQ('m3l1','prac','Это корректный IPv4-адрес?').ex='Октетов должно быть 4, каждый от 0 до 255. 255.255.255.0 — корректная запись, но так выглядит маска: как адрес устройства её использовать не принято.';
addSec('m3l2','Для чужой сети — MAC шлюза',[['Что меняется по дороге','IP-адреса отправителя и получателя остаются теми же от начала до конца пути (пока их не меняет NAT, модуль 4). А MAC-адреса в кадре меняются на каждом шаге: сначала «телефон → роутер», потом «роутер → следующий маршрутизатор» и так далее. Поэтому MAC-адрес сервера вы никогда не увидите, а MAC-адрес роутера стоит в каждом кадре, уходящем из дома.']]);
setSec('m3l2','Для специалиста','Для специалиста','ARP работает только в IPv4. В IPv6 ту же задачу решает протокол NDP. ARP не проверяет подлинность ответов — на этом построены атаки ARP-spoofing. Таблицу смотрят командой arp -a (в Linux — arp -a при установленном пакете net-tools или ip neigh).');
setSec('m3l3','DHCP: DORA','DHCP: DORA','Discover → Offer → Request → Ack. Клиент получает IP-адрес, маску, шлюз, адреса DNS-серверов и срок аренды. Работает поверх UDP: порт 67 у сервера, 68 у клиента. Аренда обычно длится от нескольких часов до суток; клиент пытается продлить её, когда проходит половина срока, а если сервер молчит, повторяет попытки до конца аренды.');
addSec('m3l3','Особые адреса',[
 ['Откуда у роутера публичный адрес','С домашней стороны адреса раздаёт роутер, а адрес на стороне провайдера (WAN) роутер получает сам: по DHCP, по PPPoE (вход по логину и паролю провайдера) или он прописан вручную. Какой вариант используется, задаёт провайдер.'],
 ['IPv6: сколько это','128 бит — в 4 раза больше бит, чем в IPv4 (32), а адресов — в 2⁹⁶ раз больше: около 3,4·10³⁸. Поэтому каждому устройству хватает собственного публичного адреса. Адрес записывают в шестнадцатеричной системе группами по 16 бит, а подряд идущие нулевые группы можно сократить до «::» (один раз за адрес).']]);
addQ('m3l3','prac',{t:'choice',q:'Срок аренды адреса — 24 часа. Когда телефон начнёт продлевать аренду?',o:['Примерно через 12 часов, когда пройдёт половина срока','Только через 24 часа','Никогда: адрес выдаётся навсегда'],a:0,ex:'Клиент пытается продлить аренду, когда проходит половина срока.'});

/* ===== модуль 4 ===== */
setSec('m4l1','Пять ролей в одной коробке','Пять ролей в одной коробке','Точка доступа (L1–L2), коммутатор (L2), маршрутизатор (L3), DHCP-сервер (L7), NAT и firewall (L3–L4). Буква L и цифра — уровень модели OSI: L2 — кадры и MAC-адреса, L3 — IP-адреса и маршрутизация, L4 — порты, L7 — приложения (подробно — в модуле 9). Часто есть и DNS-посредник: роутер принимает DNS-запросы и пересылает их провайдеру.');
addSec('m4l1','LAN и WAN',[['Как WAN получает интернет','Тип подключения задаёт провайдер: адрес по DHCP, вход по логину и паролю (PPPoE) или статический адрес. Модем и оптический терминал (ONT) только превращают сигнал линии в Ethernet; Wi-Fi, адреса и маршрутизацию добавляет роутер. Во многих домах все эти устройства спрятаны в одной коробке.']]);
addSec('m4l1','Настройки роутера',[['Диапазоны Wi-Fi в роутере','Двухдиапазонный роутер — это две точки доступа в одном корпусе: на 2,4 и 5 ГГц (трёхдиапазонный добавляет ещё один 5 ГГц или 6 ГГц). Сети можно назвать одним именем (устройство само выберет диапазон) или разными (тогда выбираете вы). «Умным» лампам и розеткам обычно подходит 2,4 ГГц: он дальше бьёт, а многие из них 5 ГГц не поддерживают.']]);
setSec('m4l2','Побочный эффект','Побочный эффект','Снаружи нельзя первым обратиться к устройству за NAT: в таблице нет записи. Это защищает, но мешает, например, подключиться к домашней камере. Решение — проброс портов, следующий урок. При этом NAT — не защита, а побочный эффект подмены адресов: по-настоящему защищает stateful firewall (следующий урок). Поэтому в IPv6, где NAT обычно не нужен, защита сохраняется за счёт firewall.');
addSec('m4l2','Побочный эффект',[['Как долго живёт запись','Запись в таблице NAT временная. Для TCP она исчезает через некоторое время после закрытия соединения или долгого молчания, для UDP — обычно уже через десятки секунд. Портов на один публичный адрес около 65 тысяч, поэтому у провайдерского NAT, который обслуживает тысячи абонентов, есть ограничения на число соединений каждого из них.']]);
setSec('m4l2','CGNAT и IPv6','CGNAT и IPv6','Многие провайдеры делают ещё один NAT у себя — CGNAT (carrier-grade NAT). Для него выделен особый диапазон 100.64.0.0/10. Если у роутера со стороны WAN адрес вида 100.64.x.x, вы сидите за провайдерским NAT, и проброс портов на домашнем роутере не поможет: пакеты из интернета до него не дойдут. Нужен «белый» публичный адрес (иногда его предлагают как платную услугу), VPN или IPv6. В IPv6 адресов хватает всем, NAT обычно не нужен: у каждого устройства свой публичный адрес, а защищает его firewall.');
setSec('m4l3','Межсетевой экран','Межсетевой экран','Проверяет пакеты по правилам: адрес, порт, протокол, направление. Правила читаются сверху вниз до первого совпадения, последнее обычно запрещает всё остальное. Межсетевой экран есть не только в роутере, но и в операционной системе компьютера (в Windows — брандмауэр).');
addSec('m4l3','Проброс портов',[
 ['UPnP','UPnP — протокол, по которому программы в вашей сети сами просят роутер открыть порт: так работают многие игры и торренты. Это удобно, но порт может открыть любая программа, в том числе вредоносная, без вашего ведома. Поэтому UPnP на роутерах часто отключают и открывают нужные порты вручную.'],
 ['VPN вместо открытых портов','VPN — зашифрованный туннель до домашней (или рабочей) сети. Устройство в кафе подключается к роутеру по одному защищённому порту и видит домашнюю сеть как свою: камеру не нужно открывать всему интернету. Как и проброс портов, входящий VPN не заработает за CGNAT.']]);

/* ===== модуль 5 ===== */
setSec('m5l1','Что хранит таблица','Что хранит таблица','Каждая строка: сеть назначения с маской, следующий шаг (next hop) и интерфейс, через который отправлять. Иногда — метрика: «стоимость» пути. Маршрутизатор не знает весь путь до сервера: он знает только, кому передать пакет следующему. Так же поступает и каждый следующий узел, пока пакет не дойдёт до цели.');
setSec('m5l1','Как выбирается маршрут','Как выбирается маршрут','Маршрутизатор ищет все строки, которым подходит адрес назначения, и берёт ту, у которой самый длинный префикс (самая точная, то есть самая «узкая» сеть). Пример: в таблице 0.0.0.0/0, 10.0.0.0/8 и 10.1.0.0/16. Адрес 10.1.5.5 подходит всем трём, выберется /16. Адрес 10.200.0.1 подходит двум (0.0.0.0/0 и 10.0.0.0/8), выберется /8. Адрес 8.8.8.8 подходит только 0.0.0.0/0. Эта запись — маршрут по умолчанию: префикс /0 означает «любой адрес». Если ничего не подошло и маршрута по умолчанию нет, пакет отбрасывается (отправителю уходит ICMP «узел недоступен»).');
setSec('m5l1','Откуда берутся маршруты','Откуда берутся маршруты','Подключённые сети — автоматически. Статические — вписаны администратором. Динамические — получены от соседей по протоколам маршрутизации: внутри сети провайдера работают OSPF и IS-IS, между провайдерами — BGP. Если линия оборвалась, соседние маршрутизаторы замечают это (пропадают сообщения), протокол пересчитывает пути, и пакеты идут в обход. Обычно на это уходит от долей секунды до минуты.');
setSec('m5l1','Таблица на вашем компьютере','Таблица на вашем компьютере','У компьютера тоже есть таблица маршрутов: своя сеть — напрямую, всё остальное — через шлюз (маршрут по умолчанию 0.0.0.0/0). Посмотреть её: route print (Windows), ip route (Linux), netstat -rn (macOS и другие).');

setSec('m5l2','TTL','TTL','Поле IP-пакета размером 1 байт (значения 0–255). Начальное значение: 64 (Linux, macOS, Android), 128 (Windows), 255 (часть сетевого оборудования). Каждый маршрутизатор уменьшает его на 1; если получилось 0, пакет уничтожается. Пример: отправлено с 64, пакет прошёл 5 маршрутизаторов — у получателя будет 59. По TTL, пришедшему с сервера, можно приблизительно оценить, сколько узлов было на пути.');
setSec('m5l2','ICMP','ICMP','ICMP — служебный протокол сетевого уровня: он не переносит данные приложений, а сообщает об ошибках и проверяет доступность. Основные сообщения: тип 8 и тип 0 — эхо-запрос и эхо-ответ (так работает ping), тип 11 — «время истекло» (TTL дошёл до нуля), тип 3 — «узел или порт недоступен». Брандмауэры часто блокируют ICMP: тогда ping не отвечает, хотя сайт открывается.');
setSec('m5l2','traceroute','traceroute','Отправляет пакеты с TTL 1, 2, 3… и записывает, кто сообщил о гибели пакета (ICMP «время истекло»). По три пробы на шаг — отсюда три значения времени в каждой строке. Windows (tracert) посылает ICMP-эхо, а Linux и macOS (traceroute) по умолчанию — UDP-пакеты на необычные порты. Разные способы иногда показывают разный путь и разные звёздочки. Маршрут туда и обратно может отличаться: traceroute показывает только путь «туда».');
setSec('m5l2','Как читать задержку','Как читать задержку','Время в строке — задержка туда и обратно (RTT). Свет в оптоволокне проходит около 200 км за 1 мс (в одну сторону), то есть примерно 100 км «туда и обратно» на каждую миллисекунду RTT. «* * *» значит, что узел не ответил за отведённое время: чаще всего он просто настроен не отвечать на ICMP, и это не поломка, если следующие строки отвечают. Резкий рост на одном шаге — длинный участок или перегруженный узел. Рост, который сохраняется до конца, — реальная проблема на пути. Рост только на одном узле, а дальше снова мало — узел медленно отвечает на ICMP, транзитный трафик это не затрагивает.');

setSec('m5l3','Сеть сетей','Сеть сетей','Интернет состоит из десятков тысяч автономных систем (AS) — сетей под единым управлением: провайдеры, крупные компании, университеты. У каждой AS есть номер (например, AS64503). Номера и блоки IP-адресов выдают региональные регистраторы: RIPE NCC для Европы, Ближнего Востока и части Азии, включая Россию, ARIN для Северной Америки и другие.');
setSec('m5l3','BGP','BGP','Каждая AS объявляет соседям, какие сети она может доставить. Объявление несёт путь — список AS, через которые оно прошло. Это помогает выбрать маршрут и отбросить петли (если в пути уже есть ваш номер AS, объявление игнорируют). BGP работает на доверии: сосед может объявить чужую сеть, ошибочно или намеренно.');
addSec('m5l3','BGP',[['Пиринг, транзит и IX','Точка обмена трафиком (IX) — площадка, где провайдеры соединяются напрямую. Пиринг — взаимный обмен трафиком своих клиентов, обычно без оплаты. Транзит — платный доступ ко «всему остальному» интернету через более крупную сеть. Пиринг не даёт доступа к чужим клиентам и сетям — только к клиентам самого партнёра.'],
 ['Случай с YouTube, 2008','24 февраля 2008 года пакистанский провайдер Pakistan Telecom, исполняя местное требование заблокировать YouTube, объявил более узкий префикс (/24) внутри сети YouTube (/22) и передал его соседу. Маршрутизаторы выбирают более точный префикс, поэтому трафик ушёл в Пакистан и там пропал. Ошибка распространилась далеко за пределы страны, и YouTube был недоступен у многих пользователей около двух часов.'],
 ['RPKI','Защита от таких ошибок — RPKI: владелец сети публикует подписанное разрешение (ROA), какая AS вправе объявлять его префикс. Маршрутизаторы проверяют объявления и отбрасывают те, что не соответствуют разрешению. Без RPKI трафик мог уйти не туда, как в 2008 году.']]);
setSec('m5l3','Выбор пути','Выбор пути','BGP выбирает не самый быстрый, а самый выгодный по политике путь: сначала свои клиенты (они платят), потом пиринг (бесплатно), потом платный транзит. Длина пути (число AS) — лишь один из критериев, поэтому путь не всегда самый короткий по расстоянию.');
setSec('m5l3','Физическая основа','Физическая основа','Магистрали — оптоволокно вдоль дорог и железных дорог, между континентами — подводные кабели. По ним проходит подавляющая часть межконтинентального трафика, спутники — малая доля. На случай обрыва между континентами проложено много независимых кабелей, а трафик перенаправляется в обход.');
getQ('m5l3','check','Что случилось бы без RPKI при ошибочном объявлении чужой сети?').ex='RPKI позволяет проверить, вправе ли AS объявлять этот префикс. Без неё трафик мог уйти не туда — как в 2008 году, когда YouTube стал недоступен у многих пользователей.';
(function(){const b=LS.m5l3.beats.find(b=>b.pro&&b.pro.indexOf('BGP доверяет')===0);if(b)b.pro='BGP доверяет объявлениям соседей. В 2008 году пакистанский провайдер ошибочно объявил более узкую сеть YouTube, и сервис примерно на два часа стал недоступен у многих пользователей. Сейчас от таких ошибок защищает проверка разрешений RPKI.';})();

/* ===== модуль 6 ===== */
setSec('m6l1','Иерархия имён','Иерархия имён','Имя читается справа налево: корень «.», зона верхнего уровня (com, ru, org), домен (ridenow), поддомен (api). У каждого уровня свои серверы, которые знают, кому делегирован следующий. Корневые серверы не знают адрес api.ridenow.com — они знают только, кто отвечает за com. Адрес окончательно знает авторитетный сервер домена ridenow.com.');
setSec('m6l1','Кэширование','Кэширование','Ответы хранятся в кэшах резолвера, роутера, операционной системы и браузера на время TTL (в секундах), которое задал владелец домена. TTL 300 — это 5 минут, 3600 — один час. Поэтому смена адреса сайта распространяется не мгновенно: пока TTL не истёк, кэш отдаёт старый адрес. Перед переездом сайта TTL заранее уменьшают. Не путайте: TTL в DNS — срок хранения записи, а TTL в IP-пакете — счётчик переходов.');
setSec('m6l1','Какой резолвер у вас','Какой резолвер у вас','По умолчанию — резолвер провайдера, его адрес выдаёт DHCP. Публичные резолверы: 1.1.1.1 (Cloudflare), 8.8.8.8 (Google), 77.88.8.8 (Яндекс). Сбросить кэш DNS в Windows: ipconfig /flushdns.');
setSec('m6l2','Основные записи','Основные записи','A — IPv4-адрес. AAAA — IPv6-адрес. CNAME — псевдоним («смотри другое имя»). MX — почтовый сервер домена. TXT — проверочные и служебные данные. NS — какие серверы отвечают за зону.');
setSec('m6l2','Признаки проблемы с DNS','Признаки проблемы с DNS','Ping по IP работает, а по имени — нет. Ошибка браузера «DNS_PROBE_FINISHED_NXDOMAIN»: NXDOMAIN означает, что такого имени не существует (чаще всего опечатка). Другое дело SERVFAIL: сервер имён не смог ответить. Одни сайты открываются, другие — нет, после переезда.');
setSec('m6l2','Что делать','Что делать','Проверить имя на опечатку. Сбросить кэш (ipconfig /flushdns). Проверить файл hosts: перед запросом к DNS система смотрит в него, и строка с чужим адресом переопределит DNS. Временно указать другой DNS-сервер, например 1.1.1.1.');

/* ===== модуль 7 ===== */
setSec('m7l1','Зачем порты','Зачем порты','IP доставляет пакет до устройства, порт — до программы на нём. Это работа транспортного уровня (L4): TCP и UDP. Порт — число 16 бит: всего 65 536 номеров (0–65535). Браузер может держать десятки соединений: у каждого свой порт отправителя.');
setSec('m7l1','Диапазоны','Диапазоны','0–1023 — известные порты служб. 1024–49151 — зарегистрированные. 49152–65535 — временные (эфемерные), их система выдаёт клиентам, например браузеру, для исходящих соединений. В Linux по умолчанию временные порты берутся из диапазона 32768–60999.');
setSec('m7l1','Частые номера','Частые номера','80 — HTTP, 443 — HTTPS, 53 — DNS, 22 — SSH, 25 и 587 — почта, 3389 — удалённый рабочий стол Windows, 3306 — MySQL, 5432 — PostgreSQL. На стороне сервера программа «слушает» порт: в выводе netstat это состояние LISTEN.');
setSec('m7l1','Пятёрка','Пятёрка','Соединение задают пять значений: протокол, адрес и порт отправителя, адрес и порт получателя. Два приложения подключены к одному серверу на порт 443 — это два разных соединения, потому что у них разные порты отправителя. Эту же пятёрку использует NAT и firewall. Сокет — это пара «адрес + порт»; соединение — пара сокетов.');
setSec('m7l2','Рукопожатие','Рукопожатие','SYN → SYN-ACK → ACK. Стороны сообщают друг другу начальные номера последовательности. Это стоит одного «круга» туда-обратно до начала передачи. Закрывается соединение обменом FIN и ACK с каждой стороны, либо внезапно сбросом RST.');
setSec('m7l2','Подтверждения и повторы','Подтверждения и повторы','Байты в потоке нумеруются. Номер в подтверждении (ACK) — это номер следующего ожидаемого байта: отправлено 400 байт, начиная с 1001, значит, это байты 1001–1400, а ACK будет 1401. Максимальный размер данных в одном сегменте (MSS) при MTU 1500 и заголовках IP и TCP по 20 байт равен 1500 − 20 − 20 = 1460 байт. Неподтверждённые данные отправляются повторно по таймеру или после трёх одинаковых ACK.');
setSec('m7l2','Управление скоростью','Управление скоростью','Окно получателя защищает его от переполнения. Окно перегрузки защищает сеть: растёт, пока всё доходит, и уменьшается при потерях. Поэтому при потере пакетов скорость TCP падает.');
setSec('m7l3','UDP','UDP','Без соединения, без рукопожатия, без подтверждений и порядка. Заголовок 8 байт (у TCP — от 20). Минимальная задержка: данные отправляются сразу. Потерянный пакет UDP никто не пересылает.');
setSec('m7l3','QUIC и HTTP/3','QUIC и HTTP/3','QUIC берёт UDP как основу и добавляет надёжность, шифрование TLS 1.3 и независимые потоки: потеря одного пакета не задерживает остальные потоки, как в TCP. HTTP/3 работает поверх QUIC, то есть поверх UDP (обычно порт 443). Им пользуются крупные сайты и мобильные приложения.');

/* ===== модуль 8 ===== */
setSec('m8l1','Методы','Методы','GET — получить. POST — создать. PUT и PATCH — изменить. DELETE — удалить. Сервер сам решает, что значит метод для конкретного пути. HTTP работает на уровне приложений (L7) и «не помнит» предыдущих запросов: чтобы сервер узнал пользователя, браузер каждый раз присылает cookie или токен.');
setSec('m8l1','Частые коды','Частые коды','200 OK, 201 Created (создано), 301 Moved Permanently, 304 Not Modified, 400 Bad Request, 401 Unauthorized (не представились: нужна авторизация), 403 Forbidden (представились, но доступа нет), 404 Not Found, 429 Too Many Requests, 500 Internal Server Error, 502 Bad Gateway, 503 Service Unavailable. Класс 5xx — ошибка на стороне сервера, 4xx — запрос клиента неверен.');
setSec('m8l2','Рукопожатие TLS 1.3','Рукопожатие TLS 1.3','ClientHello с поддерживаемыми шифрами и открытой частью ключа → ServerHello с открытой частью ключа сервера, сертификатом и подписью → каждая сторона независимо вычисляет общий секрет → зашифрованные данные. Сам секрет по сети не передаётся: передаются только открытые части, из которых секрет вычислить может лишь обладатель закрытой части.');
setSec('m8l2','Цепочка доверия','Цепочка доверия','Сертификат сайта подписан промежуточным центром, тот — корневым. Корневые сертификаты встроены в операционную систему и браузер. Сертификат выдаётся на конкретное имя и на ограниченный срок. Ошибка «сертификат выдан на другое имя» означает, что имя в адресной строке не совпадает с именем в сертификате; «сертификат истёк» — срок действия закончился.');
setSec('m8l2','Что не скрыто','Что не скрыто','Адреса, порты, объём трафика, обычно — имя сайта (SNI, передаётся в рукопожатии) и DNS-запрос, если не используется защищённый DNS (DoH, DoT). Провайдер при HTTPS видит, к какому серверу вы подключились, но не видит, какие страницы вы открываете и что вводите.');
setSec('m8l3','Балансировка','Балансировка','Алгоритмы: по кругу (round robin), к наименее загруженному, по хешу адреса клиента. Проверки здоровья регулярно опрашивают серверы и исключают тех, кто не ответил: если из трёх серверов один перестал отвечать, в работе остаются два, и клиенты этого не замечают.');
setSec('m8l3','WebSocket','WebSocket','Начинается как HTTP-запрос с заголовком Upgrade, затем соединение остаётся открытым, и обе стороны могут отправлять данные в любой момент без новых запросов. Используется в чатах, картах с движущимися машинами, биржах, онлайн-играх. Обычный HTTP устроен иначе: клиент спрашивает, сервер отвечает.');

/* ===== модуль 9 ===== */
setSec('m9l1','Семь уровней','Семь уровней','L1 физический (биты, сигнал), L2 канальный (кадры, MAC-адреса), L3 сетевой (IP, маршрутизация), L4 транспортный (TCP, UDP, порты), L5 сеансовый, L6 представления, L7 прикладной (HTTP, DNS). В реальных протоколах L5–L7 часто сливаются в одно целое. Инкапсуляция — вложение данных верхнего уровня в блок нижнего: HTTP-сообщение кладётся в TCP-сегмент, тот — в IP-пакет, тот — в кадр.');
setSec('m9l1','Метод «снизу вверх»','Метод «снизу вверх»','Физика (кабель, индикатор порта) → адрес (получен ли IP; 169.254.x.x — DHCP не ответил) → шлюз (ping роутера) → интернет по IP (ping 1.1.1.1) → DNS (nslookup) → порт и протокол → приложение. Первый неработающий шаг указывает на уровень поломки. Если ping по IP работает, а по имени нет — это DNS, прикладной уровень L7 (хотя пользователь говорит «интернета нет»).');
setSec('m9l2','ping','ping','Отправляет ICMP-эхо и ждёт ответа. ping шлюза — проверка локальной сети. ping 1.1.1.1 — выход в интернет по IP. Потери в процентах и время — качество связи. Нет ответа не всегда значит «нет связи»: узел может быть настроен не отвечать на ICMP.');
setSec('m9l2','curl -I','curl -I','Делает HTTP-запрос и показывает только заголовки ответа. Код 200 — сервер работает и страница отдаётся, 5xx — сервер есть, но сломан, нет ответа вовсе — не открыт порт или сервер недоступен.');

 m8l2:{q:'Wi-Fi кафе, провайдер и магистрали могут читать пакеты. Как сделать, чтобы читал только сервер — и чтобы это точно был он?',o:['Зашифровать трафик (TLS) и проверить сертификат сервера','Отправлять пакеты ночью','Попросить промежуточные узлы не читать'],ex:'TLS шифрует данные общим секретом, а сертификат, подписанный удостоверяющим центром, доказывает, что вы говорите именно с сервером.'},

const SPLIT={

 'Частота и длина волны':[['Частота','число колебаний сигнала в секунду; измеряется в герцах (ГГц).'],['Длина волны','расстояние между соседними гребнями волны: скорость света ÷ частота; чем выше частота, тем волна короче.']],
 'Широковещательный адрес':[['Широковещательный MAC-адрес','ff:ff:ff:ff:ff:ff — «всем устройствам в сети».']],
 'Адрес сети и широковещательный адрес':[['Адрес сети','первый адрес сети (в /24 — .0): обозначает сеть целиком, устройству не выдаётся.'],['Широковещательный IP-адрес','последний адрес сети (в /24 — .255): пакет на него получают все устройства сети; устройству не выдаётся.']],
 'Частный и публичный адрес':[['Частный адрес','адрес, который работает только в локальной сети (10.x, 172.16–31.x, 192.168.x).'],['Публичный адрес','адрес, уникальный во всём интернете.']],

function estMin(lid){const L=LS[lid];let m=0;for(const s of L.screens){if(s==='task')m+=1;else if(s==='idea')m+=1;else if(s==='sim')m+=(L.beats||[]).length*.7;else if(s==='theory')m+=((L.theory&&L.theory.sec)||[]).reduce((a,x)=>a+x[1].length,0)/1100;else if(s==='try')m+=4;else if(s==='lab')m+=5;else if(s==='prac')m+=(L.prac||[]).length*.9;else if(s==='check')m+=(L.check||[]).length*.6;}return Math.max(3,Math.round(m/1)*1);}
function lessonTags(lid){const L=LS[lid];const t=[];if(L.screens.includes('sim'))t.push('схема');if(L.screens.includes('lab'))t.push('лаборатория');if(L.screens.includes('try'))t.push('на своём устройстве');if(!t.length)t.push('теория');return t.slice(0,2);}

 $('#mapView').hidden=true;$('#testView').hidden=true;$('#lessonView').hidden=false;$('#mapBtn').hidden=false;const L=lesson(),m=MODS[L.mod],k=m.ls.indexOf(lid);
 $('#crumb').innerHTML=`Модуль ${m.n} · ${esc(m.t)} › <b>Урок ${k+1} из ${m.ls.length}: ${esc(L.t)}</b>`;if(si>=L.screens.length)si=0;showScreen(si,bi);}
function renderPhases(){const L=lesson(),box=$('#phases');box.innerHTML='';L.screens.forEach((s,i)=>{if(i){const d=document.createElement('span');d.className='ph-sep';box.appendChild(d);}
 const b=document.createElement('button');b.type='button';const st=i<cur.si?'done':i===cur.si?'cur':'';b.className='ph '+st;b.innerHTML=`<i>${i<cur.si?'✓':i+1}</i><span>${PH[s]}</span>`;
 if(i>cur.si&&!P.done[cur.lid])b.disabled=true;b.addEventListener('click',()=>{if(!b.disabled)showScreen(i);});box.appendChild(b);});}
const go=$('#goBtn');
function setGo(label,icon,on=true,pulse=false){go.classList.remove('anim');go.style.removeProperty('--pg');go.innerHTML=(icon?SV[icon]:'')+'<span></span>';go.lastChild.textContent=label;go.disabled=!on;go.classList.toggle('wait',pulse);}
const E=()=>`Этап ${cur.si+1} из ${lesson().screens.length}`;

/* --- подсказки к словам в рассказчике: наведите на подчёркнутое слово --- */
function tipify(html,skip){const terms=P.terms.filter(t=>!(P.tk||{})[t[0]]&&!(skip||[]).includes(t[0]));if(!terms.length)return html;
 const map={};terms.forEach(t=>{const key=t[0].split(' (')[0].toLowerCase();if(key.length>=3)map[key]=t[1];});const keys=Object.keys(map).sort((a,b)=>b.length-a.length);if(!keys.length)return html;
 const re=new RegExp('(^|[^\\p{L}\\p{N}-])('+keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\p{L}\\p{N}-])','iu');
 const box=document.createElement('div');box.innerHTML=html;const used=new Set();
 const walkN=n=>{for(const c of [...n.childNodes]){if(c.nodeType===1){if(!c.classList.contains('tt'))walkN(c);continue;}if(c.nodeType!==3)continue;let txt=c.textContent,frag=document.createDocumentFragment(),changed=false;
  for(;;){const m=re.exec(txt);if(!m)break;const key=m[2].toLowerCase();if(used.has(key)){frag.append(txt.slice(0,m.index+m[0].length));txt=txt.slice(m.index+m[0].length);changed=true;continue;}used.add(key);
   frag.append(txt.slice(0,m.index+m[1].length));const s=document.createElement('span');s.className='tt';s.tabIndex=0;s.dataset.d=map[key];s.textContent=m[2];frag.append(s);txt=txt.slice(m.index+m[0].length);changed=true;}
  if(changed){frag.append(txt);c.replaceWith(frag);}}};
 walkN(box);return box.innerHTML;}

/* --- управление шагом --- */
const SPEEDS=[0.6,1,1.8];
function setSpeed(v){speed=v;P.speed=v;save();const b=$('#spdBtn');if(b){b.textContent='×'+String(v).replace('.',',');b.title='Скорость анимации: '+(v<1?'медленно':v>1?'быстро':'обычная')+'. Нажмите, чтобы изменить';}const s=$('#spd');if(s)s.value=String(v);}
function renderDots(){const box=$('#dots'),L=lesson();const on=L.screens[cur.si]==='sim'&&L.beats&&L.beats.length>1;box.hidden=!on;box.innerHTML='';if(!on)return;
 L.beats.forEach((b,k)=>{const d=document.createElement('button');d.type='button';d.className='dot '+(k<cur.bi?'done':k===cur.bi?'cur':'');d.setAttribute('aria-label','Шаг '+(k+1)+' из '+L.beats.length+(k===cur.bi?' (текущий)':''));d.title='Шаг '+(k+1);
  if(k<cur.bi)d.addEventListener('click',()=>runBeat(k,true));else d.tabIndex=-1;box.appendChild(d);});}
const LEG=[['--data','данные'],['--bc','рассылка «всем»'],['--resp','ответ'],['--danger','ошибка']];

let busyTimer=null;

 const tick=()=>{const est=i!=null&&cur.dur[i];const pct=est?Math.min(98,animT/est*100):(1-Math.exp(-animT/2600))*92;go.style.setProperty('--pg',pct.toFixed(1)+'%');};
 if(i!=null){setGo('Идёт анимация…',null,false);go.classList.add('anim');tick();busyTimer=setInterval(tick,80);}}

/* --- плашки: «что изменилось» и «новое слово» прямо на схеме --- */
function wrapTxt(s,n){const out=[];let l='';for(const w of String(s).split(/\s+/)){if(l&&(l+' '+w).length>n){out.push(l);l=w;}else l=l?l+' '+w:w;}if(l)out.push(l);return out;}
function clearPlates(){const g=$('#gh');if(g)g.innerHTML='';for(const q of ['#stage .plates','#stage .pro-pop','#stage .hret:not(.inline)','#stage .gut'])document.querySelectorAll(q).forEach(e=>e.remove());}
function bboxes(){return [...document.querySelectorAll('#gn>g,#gm>g,#gc>g,#gx>*,#gh>g')].map(e=>{try{const b=e.getBBox();return b.width?[b.x-4,b.y-4,b.x+b.width+4,b.y+b.height+4]:null;}catch(_){return null;}}).filter(Boolean);}
function placePlate(w,h,avoid,near){let best=null;for(let x=10;x<=890-w;x+=20)for(let y=10;y<=530-h;y+=20){let ov=0;for(const a of avoid){const ix=Math.min(x+w,a[2])-Math.max(x,a[0]),iy=Math.min(y+h,a[3])-Math.max(y,a[1]);if(ix>0&&iy>0)ov+=ix*iy;}
  const d=near?Math.hypot(x+w/2-near.x,y+h/2-near.y):0;const c=ov*10+d*.05;if(!best||c<best.c)best={x,y,c};}return best||{x:10,y:10};}
function wrapW(g,cls,s,maxW){const t=el('text',{class:cls,x:-999,y:-999},g);const out=[];let l='';for(const w of String(s).split(/\s+/)){const c=l?l+' '+w:w;t.textContent=c;if(l&&t.getComputedTextLength()>maxW){out.push(l);l=w;}else l=c;}if(l)out.push(l);t.remove();return out;}
function svgPlate(kind,label,items,w){const g=$('#gh')||el('g',{id:'gh'},$('#sc'));const pl=el('g',{class:'plate '+kind},g);
 const lines=[];items.forEach(([nm,tx])=>{if(nm)lines.push(['nm',nm]);wrapW(pl,'tx',tx,w-30).forEach(l=>lines.push(['tx',l]));});
 const h=34+lines.reduce((a,l)=>a+(l[0]==='nm'?22:18.5),0);const near=SC.st.act&&SC.st.act[0]&&SC.nodes[SC.st.act[0]];const p=placePlate(w,h,bboxes(),near);
 el('rect',{x:p.x,y:p.y,width:w,height:h,rx:14,class:'bg'},pl);const t0=el('text',{x:p.x+14,y:p.y+20,class:'lb'},pl);t0.textContent=label;let y=p.y+40;
 lines.forEach(([c,s])=>{const t=el('text',{x:p.x+14,y,class:c},pl);t.textContent=s;y+=c==='nm'?22:18.5;});}
function gutterW(){const sc=$('#sc');if(!sc)return 0;const st=$('#stage').getBoundingClientRect(),r=sc.getBoundingClientRect();const s=Math.min(r.width/900,r.height/540);return (r.width-900*s)/2+(r.left-st.left)-14;}
function hypHtml(mode){const H=HYP[cur.lid];if(!H)return '';const c=(P.hyp||{})[cur.lid];let head,cls='';
 if(c===undefined||c===-1){head='Вы не стали гадать — это нормально.';}else if(c===0){head='Вы предполагали: «'+H.o[0]+'» — верно.';cls=' ok';}else head='Вы предполагали: «'+H.o[c]+'» — не совсем.';
 const body=`<p><strong>${esc(head)}</strong>${c===0?'':' Верный вариант: «'+esc(H.o[0])+'».'} ${esc(H.ex)}</p>`;
 if(mode==='gut')return `<div class="plate-h hq${cls}"><b>Возвращаемся к задаче</b>${body}</div>`;
 return `<div class="hret${cls}${mode==='inline'?' inline':' dock'}"><b class="k">Возвращаемся к задаче</b>${body}${mode==='inline'?'':'<div class="row"><button class="btn" type="button" data-hx>Понятно</button></div>'}</div>`;}
function showPlates(b,words,last){const hasSvg=!!$('#sc');const chg=b.ch?`<div class="plate-h"><b>Что изменилось</b>${esc(b.ch)}</div>`:'';const wd=words.map(w=>`<div class="plate-h word"><b>Новое слово</b><strong>${esc(w[0])}</strong><br>${esc(w[1])}<small class="added">✓ добавлено в словарь</small></div>`).join('');
 let dock=false;const g=hasSvg?gutterW():0;const stage=$('#stage');
 if(hasSvg&&g>=160){const w=Math.round(Math.min(340,g));const mk=(side,html)=>{if(!html)return;const d=document.createElement('div');d.className='gut '+side;d.style.width=w+'px';d.innerHTML=html;stage.appendChild(d);};
  const hy=last?hypHtml('gut'):'';const hyL=hy&&g>=250;mk('l',chg+(hyL?hy:''));mk('r',wd);dock=!!hy&&!hyL;}
 else{if(hasSvg){if(b.ch)svgPlate('chg','ЧТО ИЗМЕНИЛОСЬ',[[null,b.ch]],360);if(words.length)svgPlate('word','НОВОЕ СЛОВО · В СЛОВАРЕ',words,360);}
  else{const host=$('#stage .stage-html');if(host){const d=document.createElement('div');d.className='plates';d.innerHTML=chg+wd;host.appendChild(d);}}dock=last;}
 if(dock){const h=hypHtml('dock');if(h){const d=document.createElement('div');d.innerHTML=h;const e=d.firstChild;stage.appendChild(e);e.querySelector('[data-hx]').addEventListener('click',()=>e.remove());}}}
const hasSim=()=>lesson().screens.includes('sim');

function showScreen(si,bi=0){runId++;cur.si=si;cur.bi=0;cur.busy=false;const L=lesson(),s=L.screens[si],stage=$('#stage');resetCtl();renderPhases();$('#backBtn').disabled=si===0;stage.className='stage';stage.innerHTML='';
 if(s!=='sim')savePos();
 if(s==='task'){const H=HYP[cur.lid];const known=P.terms.filter(t=>t[2]!==cur.lid).slice(-8);const ch=(P.hyp||{})[cur.lid];const ord=H?perm(3,hsh(H.q)):[];
  stage.innerHTML=`<div class="stage-html"><div class="hyp"><div class="card"><span class="eyebrow">Задача урока</span><h2>${esc(L.task[0])}</h2><p>${esc(L.task[1])}</p><p class="bridge">${esc(L.task[2])}</p><div class="minigoals"><b>Цели урока</b><ol>${L.goals.map(g=>`<li>${esc(g)}</li>`).join('')}</ol></div>${known.length?`<div class="minigoals"><b>Вы уже знаете</b><div class="known">${known.map(t=>`<span>${esc(t[0])}</span>`).join('')}</div></div>`:''}</div>
  ${H?`<div class="card hyp-r"><span class="eyebrow">Ваше предположение</span><h3>${esc(H.q)}</h3>${ord.map(k=>`<button class="hopt" type="button" data-k="${k}" aria-pressed="${ch===k}">${esc(H.o[k])}</button>`).join('')}<button class="hopt skipq" type="button" data-k="-1" aria-pressed="${ch===-1}">Пока не знаю</button><p class="small">Ответ не оценивается. В конце схемы мы вернёмся к нему и сверим.</p></div>`:''}</div></div>`;
  stage.querySelectorAll('.hopt').forEach(b=>b.addEventListener('click',()=>{P.hyp=P.hyp||{};P.hyp[cur.lid]=+b.dataset.k;save();stage.querySelectorAll('.hopt').forEach(x=>x.setAttribute('aria-pressed',x===b));}));
  narr(E()+' · Задача','Прочитайте ситуацию и выберите, как, по-вашему, это работает. Угадывать не страшно: на схеме мы это проверим.');setGo('Дальше','next',true,true);}
 else if(s==='idea'){const mm=(L.memes||MEMES[cur.lid]).idea;stage.innerHTML=`<div class="stage-html"><div class="split"><div class="card"><span class="eyebrow">На пальцах</span><div class="analogy"><span class="ico">${ANA}</span><div><h2>${esc(L.idea[0])}</h2><p style="margin-top:10px">${esc(L.idea[1])}</p></div></div><p class="bridge">${esc(L.idea[2])}</p></div>${meme(mm[0],mm[1],mm[2])}</div></div>`;
  narr(E()+' · На пальцах','Сначала идея на бытовом примере. Аналогия помогает понять смысл, но не заменяет его: дальше на схеме покажем, как это устроено на самом деле.');setGo('К схеме','next',true,true);}
 else if(s==='sim'){cur.snaps=[];if(L.scene)mountScene(L.scene,stage);else{stage.innerHTML='<div class="stage-html" id="hs"></div>';if(L.stage==='bytes')mountBytes();if(L.stage==='mac')mountMac(0);if(L.stage==='osi')mountOsi(0);}
  if(bi>0&&bi<L.beats.length)seekBeat(bi);else runBeat(0);}
 else if(s==='try')renderTry();
 else if(s==='theory')renderTheory();
 else if(s==='prac')renderPrac();
 else if(s==='lab')renderLab();
 else if(s==='check')renderCheck();
 else if(s==='done')renderDone();}

async function seekBeat(n){skipping=true;try{for(let k=0;k<n;k++)await runBeat(k,false,true);}catch(e){skipping=false;return;}skipping=false;runBeat(n);}
async function runBeat(i,replay,ff){const L=lesson(),b=L.beats[i];cur.bi=i;runId++;const my=runId;if(!ff)skipping=false;savePos();clearPlates();
 if(L.scene){if(replay&&cur.snaps[i])SC.st=structuredClone(cur.snaps[i]);else cur.snaps[i]=structuredClone(SC.st);$('#fx').innerHTML='';draw();}
 if(L.stage==='bytes')setBytes(i);if(L.stage==='mac')mountMac(i);if(L.stage==='osi')mountOsi(i);
 const words=WL(b);const own=words.map(w=>w[0]);
 narr(`${E()} · Схема · шаг ${i+1} из ${L.beats.length}`,tipify(b.say,own));renderDots();renderLegend(!!L.scene);
 const pb=$('#proBtn');pb.hidden=!b.pro;pb.onclick=()=>{const old=$('#stage .pro-pop');if(old){old.remove();return;}const d=document.createElement('div');d.className='pro-pop';d.innerHTML=`<b>Для специалиста</b><p>${esc(b.pro)}</p>`;$('#stage').appendChild(d);};
 $('#backBtn').disabled=false;const rb=$('#replayBtn');rb.hidden=cur.anim[i]===undefined?true:!cur.anim[i];rb.disabled=!!b.act;
 if(b.act){ANIMRAN=false;animT=0;cur.busy=true;if(!ff)setBusy(true,i);try{await b.act();}catch(e){if(e!==CANCEL)console.error(e);return;}if(my!==runId)return;cur.busy=false;if(!ff){cur.dur[i]=animT;setBusy(false);}cur.anim[i]=ANIMRAN;if(i+1<cur.snaps.length)cur.snaps.length=i+1;}
 else cur.anim[i]=false;
 rb.hidden=!cur.anim[i];rb.disabled=false;
 words.forEach(w=>addTerm(w,cur.lid));
 if(!ff)showPlates(b,words,i===L.beats.length-1);
 setGo(i+1<L.beats.length?'Дальше':'Дальше: '+PH[L.screens[cur.si+1]].toLowerCase(),'next',true,true);}

/* bytes stage */
function mountBytes(){const h=$('#hs');h.innerHTML=`<div class="bytes" id="by"><div style="display:flex;flex-direction:column;gap:6px"><label for="word">Слово для передачи</label><input id="word" value="такси" maxlength="14" autocomplete="off"></div><div class="btab" id="btab"></div><div class="btot" id="btot"></div></div>`;
 $('#word').addEventListener('input',fillBytes);fillBytes();}
function fillBytes(){const v=$('#word').value||' ';const enc=new TextEncoder();let rows='<div class="r h"><span>символ</span><span>номер в таблице</span><span class="c3">байты</span><span class="c4">биты</span></div>',nb=0;
 for(const ch of v){const cp=ch.codePointAt(0),by=[...enc.encode(ch)];nb+=by.length;
  rows+=`<div class="r"><span class="ch">${ch===' '?'␣':esc(ch)}</span><span class="mono">U+${cp.toString(16).toUpperCase().padStart(4,'0')} (${cp})</span><span class="mono c3">${by.map(b=>b.toString(16).padStart(2,'0')).join(' ')}</span><span class="bits c4">${by.map(b=>b.toString(2).padStart(8,'0')).join(' ')}</span></div>`;}
 $('#btab').innerHTML=rows;$('#btot').innerHTML=`«${esc(v)}»: ${[...v].length} симв. → <b>${nb} байт</b> → <b>${nb*8} бит</b>. Столько нулей и единиц нужно передать по сети.`;}
function setBytes(i){const by=$('#by');const lv=lesson().lv||[1,2,3,4,4,4];if(by)by.className='bytes lv'+lv[i];}
const OSIROWS=[[7,'Прикладной','HTTP, DNS, DHCP','curl -v, nslookup'],[6,'Представления','TLS, кодировки','проверка сертификата'],[5,'Сеансовый','сессии, WebSocket','логи приложения'],[4,'Транспортный','TCP, UDP, порты','Test-NetConnection, nc -vz'],[3,'Сетевой','IP, маршруты, ICMP','ipconfig, ping, tracert'],[2,'Канальный','Ethernet, Wi-Fi, ARP','arp -a, индикаторы порта'],[1,'Физический','кабель, радио, свет','индикаторы, переподключение']];
function mountOsi(i){const hl=(lesson().osiHl||[])[i]||[];$('#hs').innerHTML=`<div class="osit"><div class="or h"><span>уровень</span><span>название</span><span>примеры</span><span>как проверить</span></div>${OSIROWS.map(([n,a,b,c])=>`<div class="or${hl.includes(n)?' on':''}"><span class="lv">L${n}</span><b>${a}</b><span>${b}</span><code>${c}</code></div>`).join('')}</div>`;}

 if(i<3)s+='<div class="mcard"><b>Где встречается</b><span>У каждого Wi-Fi-модуля и каждого сетевого разъёма — свой MAC-адрес. У ноутбука с кабелем и Wi-Fi их два.</span></div>';

/* try (generic) */
function renderTry(){const L=lesson(),D=L.tryData;
