/* tasks: shared by practice and check */
function hsh(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h;}
function perm(n,seed){const a=[...Array(n).keys()];let s=seed||1;for(let i=n-1;i>0;i--){s=(s*1103515245+12345)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]];}if(n>1&&a.every((v,k)=>v===k))a.reverse();return a;}
const norm=s=>String(s).trim().toLowerCase().replace(/ё/g,'е').replace(/,/g,'.').replace(/\s+/g,' ').replace(/^https?:\/\//,'');
function taskHtml(q,i,n,label){let b='';
 if(q.t==='input')b=`<div class="inrow"><input class="pin" type="text" autocomplete="off" aria-label="Ответ"><button class="btn primary" type="button" data-chk>Проверить</button>${q.hint?'<button class="btn" type="button" data-hint>Подсказка</button>':''}</div><div class="hint" hidden>${esc(q.hint||'')}</div>`;
 else if(q.t==='sort')b=`<div class="sorts">${q.items.map(([t],k)=>`<div class="srt" data-k="${k}"><span>${esc(t)}</span><div class="cats">${q.cats.map((c,j)=>`<button class="tg" type="button" data-c="${j}">${esc(c)}</button>`).join('')}</div></div>`).join('')}</div>`;
 else if(q.t==='order'||q.type==='order')b=`<div class="order"><div class="col pool"><small>Нажимайте по порядку</small></div><div class="col ans"><small>Ваш порядок</small></div></div><div style="display:flex;gap:8px"><button class="btn" type="button" data-reset>Сбросить</button></div>`;
 else{const p=perm(q.o.length,hsh(q.q));b=p.map(k=>`<button class="opt" type="button" data-k="${k}">${esc(q.o[k])}</button>`).join('');}
 return `<div class="qq" data-i="${i}"><span class="qh">${label} ${i+1} из ${n}</span><p class="qt">${esc(q.q)}</p>${b}<div class="ex" hidden></div></div>`;}
function bindTasks(root,list,store,onCh){root.querySelectorAll('.qq').forEach(qe=>{const i=+qe.dataset.i,q=list[i];const ex=qe.querySelector('.ex');
 const show=(ok,extra)=>{ex.hidden=false;ex.innerHTML=(ok?'<b>Верно.</b> ':'<b>Не совсем.</b> ')+(extra||'')+esc(q.ex||'');};
 if(q.t==='input'){const inp=qe.querySelector('.pin');const chk=()=>{if(!inp.value.trim())return;const ok=q.a.map(norm).includes(norm(inp.value));inp.classList.toggle('right',ok);inp.classList.toggle('wrong',!ok);show(ok,ok?'':'Правильный ответ: '+esc(q.a[0])+'. ');if(store[i]===undefined||ok)store[i]=ok;onCh();};
  qe.querySelector('[data-chk]').addEventListener('click',chk);inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();chk();}});const hb=qe.querySelector('[data-hint]');if(hb)hb.addEventListener('click',()=>{qe.querySelector('.hint').hidden=false;});}
 else if(q.t==='sort'){const pick={};qe.querySelectorAll('.srt').forEach(r=>{const k=+r.dataset.k;r.querySelectorAll('[data-c]').forEach(b=>b.addEventListener('click',()=>{if(store[i]!==undefined)return;pick[k]=+b.dataset.c;r.querySelectorAll('[data-c]').forEach(x=>x.setAttribute('aria-pressed',x===b));
   if(Object.keys(pick).length===q.items.length){let ok=true;qe.querySelectorAll('.srt').forEach(rr=>{const kk=+rr.dataset.k,right=q.items[kk][1];const good=pick[kk]===right;if(!good)ok=false;rr.classList.add(good?'right':'wrong');if(!good)rr.querySelector(`[data-c="${right}"]`).classList.add('should');});store[i]=ok;show(ok,ok?'':'Зелёной рамкой отмечен правильный вариант. ');onCh();}}));});}
 else if(q.t==='order'||q.type==='order'){const pool=qe.querySelector('.pool'),ans=qe.querySelector('.ans');const sh=perm(q.o.length,hsh(q.q));
  const fill=()=>{qe.querySelectorAll('.it').forEach(x=>x.remove());sh.forEach(k=>{const b=document.createElement('button');b.type='button';b.className='it';b.textContent=q.o[k];b.dataset.k=k;b.addEventListener('click',()=>{if(b.parentNode!==pool)return;b.classList.add('in');ans.appendChild(b);
    if(ans.querySelectorAll('.it').length===q.o.length){const got=[...ans.querySelectorAll('.it')].map(x=>+x.dataset.k);const ok=got.every((v,n)=>v===n);ans.querySelectorAll('.it').forEach((x,n)=>x.classList.add(+x.dataset.k===n?'right':'wrong'));show(ok,ok?'':'Правильный порядок: '+q.o.map((o,n)=>(n+1)+') '+esc(o)).join('; ')+'. ');if(store[i]===undefined||ok)store[i]=ok;onCh();}});pool.appendChild(b);});ex.hidden=true;};
  qe.querySelector('[data-reset]').addEventListener('click',fill);fill();}
 else qe.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{const k=+b.dataset.k;qe.querySelectorAll('.opt').forEach(x=>x.classList.remove('right','wrong'));b.classList.add(k===q.a?'right':'wrong');if(k!==q.a)qe.querySelector(`.opt[data-k="${q.a}"]`).classList.add('right');show(k===q.a);if(store[i]===undefined)store[i]=k===q.a;onCh();}));});}

 const ps=r.outs.join(', ');let t=`<b>${r.src} → ${r.dst==='all'?'всем':r.dst}.</b> `;

  if(r.how==='flood')t+=`Адрес получателя неизвестен — кадр разослан в порты ${ps}.`;if(r.how==='fwd')t+=r.outs.length?`Адрес получателя известен — кадр ушёл только в порт ${ps}.`:'Получатель за тем же портом — кадр не пересылается.';if(r.how==='bcast')t+=`Широковещательный кадр — разослан в порты ${ps}.`;}
 if(r.acc.length)t+=` Принял: ${r.acc.join(', ')}.`;if(r.drop.length)t+=` Отбросил: ${r.drop.join(', ')}.`;

 for(let r=0;r<max;r++)for(const l of lists){if(!l.length)continue;const q=l[(r+off)%l.length];if(!out.includes(q))out.push(q);}return out.slice(0,8);}

 const upd=()=>{const n=Object.keys(res).length,ok=Object.values(res).filter(Boolean).length;$('#tchip').textContent=`Ответов ${n} из ${list.length}`;if(n<list.length)return;const pass=ok>=need;const box=$('#tres');

$('#drClose').addEventListener('click',closeDr);$('#scrim').addEventListener('click',closeDr);
let glMod='all',glQ='',glHide=false;
function glList(){const f=P.terms.map((t,i)=>({t,i})).filter(({t})=>(glMod==='all'||String(LS[t[2]]&&LS[t[2]].mod)===glMod)&&(!glQ||(t[0]+' '+t[1]).toLowerCase().includes(glQ.toLowerCase()))&&!(glHide&&(P.tk||{})[t[0]]));
 if(!f.length)return '<p class="empty">'+(P.terms.length?'Ничего не найдено.':'Пока пусто. Слова появляются здесь после шагов схемы.')+'</p>';
 f.sort((a,b)=>ORDER.indexOf(a.t[2])-ORDER.indexOf(b.t[2])||a.i-b.i);let last=-1,h='';
 for(const {t} of f){const L=LS[t[2]];const mo=L?L.mod:-1;if(mo!==last){last=mo;if(glMod==='all'&&MODS[mo])h+=`<div class="glm">Модуль ${MODS[mo].n} · ${esc(MODS[mo].t)}</div>`;}
  const kn=!!(P.tk||{})[t[0]];h+=`<div class="gl${kn?' known':''}"><b>${esc(t[0])}</b><span>${esc(t[1])}</span><div class="acts"><button type="button" data-go="${t[2]}">К уроку: ${esc(L?L.t:'')}</button><button type="button" data-kn="${esc(t[0])}" class="${kn?'on':''}">${kn?'✓ знаю':'знаю'}</button></div></div>`;}
 return h;}
function glRefresh(){const l=$('#gll');if(!l)return;l.innerHTML=glList();l.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const id=b.dataset.go;if(avail(id)){closeDr();openLesson(id);}});
 l.querySelectorAll('[data-kn]').forEach(b=>b.onclick=()=>{P.tk=P.tk||{};const n=b.dataset.kn;if(P.tk[n])delete P.tk[n];else P.tk[n]=true;save();glRefresh();});}
$('#glBtn').addEventListener('click',()=>{const mods=[...new Set(P.terms.map(t=>LS[t[2]]&&LS[t[2]].mod).filter(x=>x!==undefined))].sort((a,b)=>a-b);
 openDr(`Словарь · ${P.terms.length}`,`<input type="search" id="glq" placeholder="Найти термин" aria-label="Поиск по словарю" value="${esc(glQ)}"><div class="glf"><select id="glm" aria-label="Модуль"><option value="all">Все модули</option>${mods.map(m=>`<option value="${m}">Модуль ${MODS[m].n} · ${esc(MODS[m].t)}</option>`).join('')}</select><label><input type="checkbox" id="glh"${glHide?' checked':''}> скрыть «знаю»</label></div><div id="gll" style="display:flex;flex-direction:column;gap:8px"></div>`);
 if(!mods.map(String).includes(glMod))glMod='all';$('#glm').value=glMod;glRefresh();
 $('#glq').addEventListener('input',e=>{glQ=e.target.value;glRefresh();});$('#glm').addEventListener('change',e=>{glMod=e.target.value;glRefresh();});$('#glh').addEventListener('change',e=>{glHide=e.target.checked;glRefresh();});});
$('#setBtn').addEventListener('click',()=>{openDr('Настройки',`<div class="setg"><b>Скорость анимации</b><select id="spd" aria-label="Скорость анимации"><option value="0.6">Медленно</option><option value="1">Обычно</option><option value="1.8">Быстро</option></select><span class="empty">Скорость можно менять и прямо в уроке, рядом с кнопкой повтора.</span></div><div class="setg"><b>Прогресс</b><button class="btn" id="rst" type="button" style="width:max-content">Сбросить прогресс и словарь</button><span class="empty" id="rstMsg"></span></div>`);
 $('#spd').value=String(speed);$('#spd').addEventListener('change',e=>{setSpeed(+e.target.value);});
 $('#rst').addEventListener('click',()=>{const b=$('#rst');if(b.dataset.c!=='1'){b.dataset.c='1';b.textContent='Нажмите ещё раз для подтверждения';return;}P={done:{},terms:[],all:P.all,speed:P.speed,hyp:{},tk:{},tp:{},tt:{},pos:null};save();$('#glCount').textContent='0';$('#rstMsg').textContent='Прогресс сброшен.';b.dataset.c='';b.textContent='Сбросить прогресс и словарь';if(!$('#mapView').hidden)renderMap();});});

setSpeed(speed);$('#glCount').textContent=P.terms.length;renderMap();
})();

</script>
</body></html>
