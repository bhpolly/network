<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Курс «Путь пакета»</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: светлая студийная эстетика — лавандово-белый фон, крупные широкие заголовки капсом,
   градиентное слово-акцент, лаймовые полосы, чёрные кнопки-таблетки, стеклянные сферы.
   Карта курса — витрина; урок — один экран: этапы, сцена, сводка шага, рассказчик. Мемы — в каждом уроке. */
:root{
  --bg:#F2F1FA; --panel:#FFFFFF; --panel-2:#F6F5FC; --line:#E3E1F0; --line-soft:#ECEBF6;
  --fg:#0B0B14; --muted:#5A5873; --faint:#9A98B3;
  --ink:#0B0B14; --lime:#D7F542; --lime-ink:#1A2200;
  --primary:#5240FF; --teal:#0F9B76; --amber:#C46A00; --danger:#E0245E; --violet:#8E3FE8;
  --grad:linear-gradient(95deg,#3E5BFF 0%,#7B4BFF 45%,#C460E6 100%);
  --glow:rgba(82,64,255,.18); --on-accent:#FFFFFF; --scrim:rgba(20,16,50,.35); --zone:rgba(82,64,255,.045);
  --shadow:0 18px 50px -24px rgba(48,36,140,.35);
  --f-display:'Unbounded','Golos Text',system-ui,sans-serif;
  --f-body:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow:hidden;display:flex;flex-direction:column}
body>*{flex:none}
body>.lesson{flex:1 1 auto}
body.mapview{overflow:auto}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 16px;font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn[disabled]{opacity:.4;cursor:default}
.count{font-family:var(--f-mono);font-size:11px;background:var(--lime);color:var(--lime-ink);border-radius:999px;padding:1px 7px;font-weight:600}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* header */
.top{width:100%;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding-block:14px 2px}
.brand{display:flex;gap:10px;align-items:center;border:0;background:none;padding:0;cursor:pointer;text-align:left}
.logo{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ink);flex:none}
.logo svg{width:17px;height:17px;fill:var(--lime)}
.brand b{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.1;display:block;letter-spacing:.02em;text-transform:uppercase}
.brand small{display:block;font-size:12px;color:var(--muted)}
.crumb{flex:1;min-width:0;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--fg);font-weight:600}
.tools{display:flex;gap:8px;margin-left:auto}

/* ---------- course map ---------- */
.map{width:100%;padding-block:10px 40px;display:flex;flex-direction:column;gap:26px}
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:center;min-height:420px}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(34px,5.4vw,74px);line-height:1.02;margin:0 0 18px;text-transform:uppercase;letter-spacing:-.01em}
.hero p{margin:0 0 22px;color:var(--muted);font-size:16.5px;max-width:52ch}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.go-big{border:0;border-radius:999px;padding:8px 8px 8px 22px;font-size:15.5px;font-weight:600;background:var(--ink);color:#fff;cursor:pointer;display:inline-flex;gap:14px;align-items:center}
.go-big i{width:36px;height:36px;border-radius:50%;background:var(--lime);display:grid;place-items:center;color:var(--lime-ink)}
.go-big svg{width:16px;height:16px}
.hero-art{position:relative;min-width:0}
.hero-art svg{width:100%;height:auto;display:block}
.hero-tag{position:absolute;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);line-height:1.4}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;background:var(--panel);border-radius:28px;padding:22px 24px;box-shadow:var(--shadow)}
.stats div{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.stats b{font-family:var(--f-display);font-size:clamp(24px,2.8vw,38px);font-weight:700;line-height:1.1}
.stats span{font-size:13px;color:var(--muted)}
.band{background:var(--lime);border-radius:32px;padding:26px 24px 24px;display:flex;flex-direction:column;gap:18px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sec-h h2{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,2.8vw,36px);line-height:1.08;margin:0;text-transform:uppercase}
.sec-h span{font-size:14px;color:var(--muted)}
.band .sec-h span{color:#3b4310}
.prog{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#3b4310;min-width:min(300px,100%)}
.bar{height:8px;border-radius:4px;background:rgba(0,0,0,.12);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:4px}
.route{background:var(--panel);border-radius:22px;padding:12px 16px;overflow-x:auto}
.route svg{display:block;width:100%;min-width:760px;height:auto}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.mod{background:var(--panel);border-radius:22px;padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mod.locked{background:rgba(255,255,255,.55)}
.mod-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mod-n{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:600}
.pill{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--panel-2);color:var(--muted)}
.pill.ok{background:var(--ink);color:var(--lime)}
.pill.now{background:var(--primary);color:#fff}
.mod h3{margin:0;font-size:17px;line-height:1.25;font-weight:700}
.mod .q{margin:0;color:var(--muted);font-size:13.5px}
.mod ul{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.les{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line-soft);background:var(--panel-2);border-radius:14px;padding:8px 10px;font-size:13.5px;cursor:pointer}
.les:hover{border-color:var(--ink)}
.les[disabled]{cursor:default;opacity:.5}
.les[disabled]:hover{border-color:var(--line-soft)}
.les .st{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--faint)}
.les.done .st{background:var(--ink);border-color:var(--ink);color:var(--lime)}
.les.next .st{background:var(--primary);border-color:var(--primary);color:#fff}
.les span.t{flex:1;min-width:0}
.les small{color:var(--faint);font-size:12px;white-space:nowrap}
.soon{font-size:13px;color:var(--muted);margin:0}
.memes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.memes figure{margin:0;display:flex;flex-direction:column;gap:8px}
.memes figcaption{font-size:13px;color:var(--muted)}
.final{border-radius:28px;padding:34px 30px;background:linear-gradient(110deg,#3E5BFF 0%,#7B4BFF 45%,#E06BB8 78%,#FF9A4D 100%);color:#fff;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
.final h2{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3vw,40px);line-height:1.06;margin:0;text-transform:uppercase;max-width:18ch}
.final .go-big{background:#fff;color:var(--ink)}

/* memes */
.meme{position:relative;aspect-ratio:4/5;max-width:100%;border-radius:20px;overflow:hidden;background:#3b4148;box-shadow:var(--shadow)}
.meme svg,.meme img{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.meme .cap{position:absolute;left:5%;right:5%;text-align:center;color:#fff;font-family:var(--f-body);font-weight:600;text-transform:uppercase;line-height:1.05;font-size:clamp(15px,2.2vw,30px);text-shadow:0 2px 8px rgba(0,0,0,.55),0 0 2px rgba(0,0,0,.6);letter-spacing:.01em;text-wrap:balance}
.meme .cap.t{top:5%}
.meme .cap.b{bottom:5%}
.meme.sm .cap{font-size:clamp(13px,1.4vw,20px)}

/* ---------- lesson ---------- */
.lesson{min-height:0;display:flex;flex-direction:column;width:100%;gap:10px;padding-bottom:12px;padding-top:6px}
.lesson>*{flex:none}
.lesson>.body{flex:1 1 0}
.phases{display:flex;gap:4px;background:var(--panel);border-radius:999px;padding:5px;overflow-x:auto;box-shadow:0 6px 20px -14px rgba(48,36,140,.35)}
.ph{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:999px;border:0;background:transparent;cursor:pointer;white-space:nowrap;font-size:13.5px;font-weight:600;color:var(--muted)}
.ph:hover{background:var(--panel-2)}
.ph i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);background:var(--panel-2);color:var(--faint)}
.ph.done{color:var(--fg)}
.ph.done i{background:var(--ink);border-color:var(--ink);color:var(--lime)}
.ph.cur{background:var(--ink);color:#fff}
.ph.cur i{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.ph[disabled]{cursor:default;opacity:.45}
.ph-sep{flex:none;width:12px;height:1px;background:var(--line);align-self:center}
.body{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,340px);gap:10px;min-height:0}
.stage{background:var(--panel);border-radius:26px;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:var(--shadow)}
.stage-svg{flex:1;min-height:0;padding:8px}
.stage-svg svg{width:100%;height:100%;display:block}
.stage-html{flex:1;min-height:0;overflow:auto;padding:26px 30px}
.labbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-soft);font-size:13px}
.labbar .grp{display:flex;gap:4px;align-items:center}
.labbar .grp>span{color:var(--muted);margin-right:4px}
.tg{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;cursor:pointer}
.tg[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.side{background:var(--panel);border-radius:26px;min-width:0;min-height:0;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.side-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:14px 18px 10px}
.side-h b{font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.side-h span{font-size:12px;color:var(--faint)}
.side-b{flex:1;min-height:0;overflow:auto;padding:4px 18px 18px;display:flex;flex-direction:column;gap:12px}
.srow b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.srow p{margin:0;font-size:14px}
.word{border-radius:18px;padding:12px 14px;background:var(--lime);color:var(--lime-ink)}
.word b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px;opacity:.7}
.word strong{font-size:15.5px}
.word p{margin:2px 0 0;font-size:13.5px}
details.pro{border-top:1px dashed var(--line);padding-top:10px;font-size:13px;color:var(--muted)}
details.pro summary{cursor:pointer;font-weight:600;color:var(--violet);font-size:12.5px}
details.pro p{margin:6px 0 0}
.goals{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.known{display:flex;flex-wrap:wrap;gap:6px}
.known span{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--panel-2);color:var(--muted)}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tasks li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:13.5px;align-items:start}
.tasks li i{font-style:normal;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;margin-top:1px}
.tasks li.done i{background:var(--ink);border-color:var(--ink);color:var(--lime)}
.tasks li.done span{color:var(--muted);text-decoration:line-through}
.lablog{display:flex;flex-direction:column;gap:6px;font-size:13px}
.lablog div{padding:9px 12px;border-radius:14px;background:var(--panel-2)}
.lablog div:first-child{background:var(--lime);color:var(--lime-ink)}
.side .meme{width:100%;max-width:240px;align-self:center;flex:none}

/* narrator */
.narr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;align-items:center;background:var(--panel);border-radius:26px;padding:14px 14px 14px 22px;min-height:104px;box-shadow:var(--shadow);border-left:8px solid var(--lime)}
.narr-k{font-family:var(--f-mono);font-size:12px;color:var(--primary);font-weight:600}
.narr p{margin:3px 0 0;font-size:16px;line-height:1.5;max-width:110ch;text-wrap:pretty}
.narr p b{font-weight:700}
.narr-side{display:flex;gap:8px;align-items:center}
.ibtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer}
.ibtn:hover{border-color:var(--ink)}
.ibtn svg{width:18px;height:18px}
.ibtn[disabled]{opacity:.3;cursor:default}
.go{border:0;border-radius:999px;padding:8px 8px 8px 24px;min-width:200px;font-size:16px;font-weight:600;background:var(--ink);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-direction:row-reverse}
.go svg{width:38px;height:38px;padding:10px;border-radius:50%;background:var(--lime);color:var(--lime-ink);flex:none}
.go span{flex:1;text-align:left}
.go[disabled]{opacity:.45;cursor:default}
.go.wait{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(215,245,66,.9)}50%{box-shadow:0 0 0 9px rgba(215,245,66,0)}}

/* cards inside stage */
.card{max-width:780px;margin:auto 0;display:flex;flex-direction:column;gap:16px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,280px);gap:26px;align-items:center;margin:auto 0}
.eyebrow{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--lime-ink);background:var(--lime);border-radius:999px;padding:4px 12px;letter-spacing:.04em;text-transform:uppercase;align-self:flex-start}
.card h2{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,2.6vw,34px);line-height:1.12;margin:0;text-wrap:balance;text-transform:uppercase}
.card p{margin:0;font-size:17px;line-height:1.6;max-width:62ch}
.card .muted{color:var(--muted);font-size:15px}
.analogy{display:grid;grid-template-columns:52px minmax(0,1fr);gap:16px;align-items:start;padding:20px;border-radius:22px;background:var(--panel-2)}
.analogy .ico{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--lime)}
.analogy .ico svg{width:24px;height:24px}
.analogy h2{font-size:clamp(18px,2vw,24px)}
.analogy p{font-size:16px}
.bridge{font-size:15px;color:var(--muted);border-left:4px solid var(--lime);padding-left:12px}

/* bytes */
.bytes{display:flex;flex-direction:column;gap:16px;max-width:880px}
.bytes label{font-size:13px;color:var(--muted);font-weight:600}
.bytes input{font-size:22px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);width:min(360px,100%)}
.btab{display:grid;gap:5px;font-size:14px}
.btab .r{display:grid;grid-template-columns:70px 150px 120px minmax(0,1fr);gap:12px;align-items:center;padding:8px 14px;border-radius:16px;background:var(--panel-2)}
.btab .r.h{background:none;padding-block:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btab .ch{font-size:24px;font-weight:700;text-align:center}
.btab .mono{font-family:var(--f-mono);font-size:13.5px;overflow-wrap:anywhere}
.btab .bits{font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;color:var(--primary)}
.bytes .c3,.bytes .c4{opacity:.12;transition:opacity .4s}
.bytes.lv2 .c3,.bytes.lv3 .c3,.bytes.lv4 .c3,.bytes.lv3 .c4,.bytes.lv4 .c4{opacity:1}
.btot{font-size:17px;padding:14px 18px;border-radius:18px;background:var(--lime);color:var(--lime-ink);opacity:.15;transition:opacity .4s}
.bytes.lv4 .btot{opacity:1}
.btot b{font-family:var(--f-mono)}

/* mac */
.macs{display:flex;flex-direction:column;gap:16px;max-width:880px}
.macbig{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;font-family:var(--f-mono);font-size:clamp(26px,3.6vw,46px);font-weight:600}
.macbig .by{padding:4px 10px;border-radius:14px;border:2px solid transparent;transition:all .3s}
.macbig .sep{color:var(--faint);padding-bottom:6px}
.macbig .by.hl{border-color:var(--amber);background:rgba(196,106,0,.1)}
.macbig .by.oui{border-color:var(--primary);background:rgba(82,64,255,.08)}
.macbig .by.nic{border-color:var(--teal);background:rgba(15,155,118,.08)}
.maclegend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px}
.maclegend span{display:flex;gap:8px;align-items:center}
.maclegend i{width:14px;height:14px;border-radius:50%;display:inline-block}
.mcard{padding:16px 18px;border-radius:20px;background:var(--panel-2);display:flex;flex-direction:column;gap:6px;font-size:15px}
.mcard b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mcard code,.cmd code{font-family:var(--f-mono)}
.conv{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-family:var(--f-mono);font-size:18px}
.conv span{padding:6px 14px;border-radius:999px;background:var(--panel)}

/* try + quiz */
.cmds{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;max-width:900px}
.cmd{padding:14px 16px;border-radius:20px;background:var(--panel-2);display:flex;flex-direction:column;gap:6px}
.cmd b{font-size:13px}
.cmd .line{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--ink);color:#fff;border-radius:12px;padding:8px 10px}
.cmd .line code{font-size:13px;overflow-wrap:anywhere;color:var(--lime)}
.cmd small{color:var(--muted);font-size:12.5px}
.copy{border:0;background:none;color:#fff;font-size:12px;font-weight:600;cursor:pointer;flex:none;opacity:.8}
.selfcheck{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px}
.selfcheck input{width:20px;height:20px;accent-color:var(--ink)}
.quiz{display:flex;flex-direction:column;gap:24px;max-width:820px}
.qq{display:flex;flex-direction:column;gap:8px}

.glf label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
.glm{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 -2px;font-weight:600}
.gl.known{opacity:.55}
.gl .acts{display:flex;gap:12px;margin-top:4px;align-items:center}
.gl .acts button{border:0;background:none;padding:0;font-size:12.5px;font-weight:600;color:var(--violet);cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.gl .acts button.on{color:var(--teal)}
/* карта */
.hero2{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:24px;align-items:center;background:var(--panel);border-radius:28px;padding:22px 28px;box-shadow:var(--shadow)}
.hero2 h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.2vw,44px);line-height:1.06;margin:0 0 8px;text-transform:uppercase}
.hero2 p{margin:0 0 14px;color:var(--muted);font-size:15px;max-width:60ch}
.hero2 .hart{width:190px}
.hero2 .hart svg{width:100%;height:auto;display:block}
.hstats{display:flex;gap:6px 22px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--muted)}
.hstats b{color:var(--fg);font-size:15px}
.cta .sub{font-size:13px;color:var(--muted)}
.stk{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:12;box-shadow:0 14px 40px -10px rgba(20,16,50,.55)}
.les{flex-wrap:wrap}
.les .meta{display:flex;gap:6px;align-items:center;flex:none;font-size:12px;color:var(--faint);white-space:nowrap}
.tag{font-style:normal;font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--cur-bg);color:var(--primary)}
.les.lock{opacity:.6;cursor:help}
.lockmsg{font-size:12.5px;color:var(--amber);padding:2px 10px 4px 44px;margin:0}
.know{border:1px solid var(--line);background:var(--panel);border-radius:999px;font-size:12px;font-weight:600;padding:3px 10px;cursor:pointer}
.know:hover{border-color:var(--ink)}
.foot{display:flex;justify-content:center;padding-top:6px;font-size:12.5px}
.tview{max-width:880px;margin:10px auto 40px;display:flex;flex-direction:column;gap:18px}
.tview .box{background:var(--panel);border-radius:26px;padding:26px 30px;box-shadow:var(--shadow)}
.tres{border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.tres.ok{background:var(--lime);color:var(--lime-ink)}
.tres.no{background:var(--cur-bg)}
.tres h3{margin:0;font-size:20px}.tres p{margin:0;font-size:15px}

 st.act=[];draw();return {how,outs,learned,acc,drop,src,dst};}

/* какой мем показать: свой у каждого урока; при повторной сдаче того же урока — соседний, чтобы подряд не повторялись */
function pickMeme(good){const kind=good?'good':'bad';if(cur.mp&&cur.mp.kind===kind)return cur.mp.html;
 const i=ORDER.indexOf(cur.lid);let m=null,key=null;
 for(let d=0;d<ORDER.length;d++){const id=ORDER[(i+d)%ORDER.length],c=MXL[id]&&MXL[id][kind];if(!c)continue;if(id+':'+kind!==P.lm){m=c;key=id+':'+kind;break;}}
 if(!m){m=good?GOOD:BAD;key='generic:'+kind;}
 P.lm=key;save();const html=meme(m[0],m[1],m[2],1);cur.mp={kind,html};return html;}

m0l1:{mod:0,t:'Всё — числа',stage:'bytes',goals:['Понять, что сеть передаёт только числа','Узнать, что такое бит, байт и кодировка','Посчитать, сколько весит слово'],
 task:['Как передать слово по проводу?','Вы нажимаете «Заказать поездку». Телефон должен сообщить серверу адрес: «Пушкинская, 10». Но по проводу нельзя передать букву — только сигнал: есть ток или нет тока, есть радиоволна или нет.','Как с помощью двух состояний сигнала передать любое слово?'],
 idea:['Азбука Морзе','Телеграфисты XIX века передавали слова короткими и длинными сигналами: у каждой буквы было своё сочетание. Компьютеры поступают так же, только проще: у каждого символа есть номер, а номер записывается нулями и единицами.','Дальше на схеме вы увидите, как слово «такси» превращается в поток нулей и единиц.'],
 beats:[
 {say:'У каждого символа есть номер в таблице кодировки. Сегодня почти все программы и сайты используют кодировку <b>UTF-8</b>. Впишите в поле любое слово — номера появятся сразу.',what:'Слово разбито на символы, для каждого найден номер в таблице.',who:'Только телефон: сеть пока не участвует.',ch:'Текст превратился в последовательность чисел.',w:['Кодировка','таблица, в которой каждому символу присвоен номер. Самая распространённая — UTF-8.']},
 {say:'Числа хранятся в <b>байтах</b>. Байт вмещает число от 0 до 255. Латинской букве в UTF-8 хватает одного байта, русской нужно два. Поэтому «такси» занимает 10 байт, а «taxi» — 4.',what:'Номера символов записаны байтами.',who:'Телефон.',ch:'Каждый символ занимает 1 или 2 байта.',w:['Байт','единица данных из 8 бит; хранит число от 0 до 255.'],pro:'Байты принято записывать в шестнадцатеричной системе: d1 82 — это два байта со значениями 209 и 130. Подробно эта запись разбирается в уроке о MAC-адресе.'},
 {say:'Каждый байт раскладывается на 8 <b>бит</b> — восемь нулей и единиц. Именно биты передаются по проводу импульсами тока, по воздуху — радиоволнами, по оптоволокну — вспышками света.',what:'Каждый байт разложен на 8 бит.',who:'Телефон.',ch:'Слово стало потоком нулей и единиц, его уже можно передать сигналом.',w:['Бит','наименьшая единица информации: 0 или 1.']},
 {say:'Главный вывод урока: сеть ничего не знает о буквах, картинках и заказах такси. Она перевозит байты. Смысл им придают программы на двух концах: приложение на телефоне и программа на сервере.',what:'Посчитан общий объём сообщения.',who:'Телефон и, в будущем, сервер.',ch:'Мы знаем, что именно и в каком объёме нужно передать.',w:['Данные','любая информация, представленная в виде байтов.'],pro:'Скорость сети измеряют в битах в секунду, а размер файлов — в байтах. 100 Мбит/с — это около 12,5 мегабайта в секунду.'}],
 check:[{q:'Сколько байт займёт слово «сеть» в UTF-8?',o:['4','8','32'],a:1,ex:'Каждая русская буква в UTF-8 занимает 2 байта: 4 × 2 = 8.'},{q:'Что на самом деле передаётся по сетевому кабелю?',o:['Буквы и картинки','Биты — сигналы 0 и 1','Файлы целиком'],a:1,ex:'Любые данные сначала превращаются в байты, а байты — в последовательность бит. По кабелю идут только биты.'}]},
m0l2:{mod:0,t:'Пакеты',scene:'packets',goals:['Понять, зачем данные режут на части','Узнать, что такое пакет и заголовок','Отличать задержку от пропускной способности'],
 task:['Как отправить большое сообщение надёжно?','Фотография весит 3 мегабайта. Если отправить её одним куском, линия будет занята, пока файл не дойдёт, а одна ошибка по дороге испортит его целиком.','Как передавать большие данные надёжно и не мешая другим?'],
 idea:['Переезд в грузовиках','Мебель целого дома не помещается в одну машину. Её разбирают на части, нумеруют коробки и пишут на каждой адрес. Машины едут разными дорогами и приезжают в разном порядке, но по номерам всё собирают заново. Если пропала одна коробка, везут только её.','На схеме — телефон, сервер RideNow и несколько промежуточных узлов сети между ними.'],
 beats:[
 {say:'Телефон отправляет заказ на сервер RideNow. Сообщение разрезается на части — <b>пакеты</b>. В нашем примере их четыре; на схеме они появились рядом с телефоном.',what:'Сообщение разрезано на 4 пакета.',who:'Телефон.',ch:'Вместо одного большого сообщения — четыре небольших.',w:['Пакет','порция данных с заголовком: кому, от кого, какой номер.'],act:async()=>{SC.st.pk='split';SC.st.act=['phone'];draw();await wait(600);}},
 {say:'К каждому пакету добавляется <b>заголовок</b> — как адрес на коробке: от кого, кому и номер по порядку. Сами данные внутри пакета называют полезной нагрузкой.',what:'К пакетам добавлены заголовки.',who:'Телефон.',ch:'На каждом пакете написано, куда его доставить и каким по счёту он идёт.',w:['Заголовок','служебная информация в начале пакета: адреса, номер, длина.'],act:async()=>{SC.st.pk='head';draw();await wait(600);}},
 {say:'Пакеты отправлены. Каждый <b>узел сети</b> передаёт пакет дальше независимо от остальных, поэтому пакеты идут разными путями и с разной скоростью. Следите за порядком, в котором они придут.',what:'Пакеты прошли через сеть разными маршрутами.',who:'Телефон, пять промежуточных узлов, сервер.',ch:'Пакеты пришли в порядке 2, 1, 4, 3.',w:['Узел сети','любое устройство, которое принимает пакеты и передаёт их дальше.'],act:async()=>{const st=SC.st;st.pk=null;st.act=[];st.slots=[];draw();
  const R=[[['phone','a','d','srv'],1100,0,1],[['phone','b','d','srv'],800,150,2],[['phone','c','e','srv'],1400,300,3],[['phone','b','e','srv'],1200,450,4]];
  await Promise.all(R.map(async([path,seg,delay,n])=>{await wait(delay);for(let i=0;i<path.length-1;i++)await moveFrame(path[i],path[i+1],{label:'№'+n,dur:seg});st.slots.push(n);draw();}));}},
 {say:'Сервер получил пакеты не по порядку, но по номерам в заголовках собирает сообщение заново. Если бы один пакет потерялся, пришлось бы переслать только его, а не всё сообщение.',what:'Сервер собрал сообщение по номерам пакетов.',who:'Сервер RideNow.',ch:'Заказ восстановлен целиком.',w:['Сборка','восстановление сообщения из пакетов по их номерам.'],pro:'На практике нумерацией и повторной отправкой занимается протокол TCP — он подробно разбирается в модуле 7.',act:async()=>{const st=SC.st;if(st.slots.length<4)st.slots=[2,1,4,3];st.sorted=true;st.act=['srv'];draw();await wait(600);}},
 {say:'Две главные характеристики сети. <b>Задержка</b> — сколько времени идёт один пакет, в миллисекундах. <b>Пропускная способность</b> — сколько данных проходит за секунду, в мегабитах в секунду. Это разные вещи: широкая дорога не становится от этого короче.',what:'Введены две характеристики качества сети.',who:'Вся сеть.',ch:'Теперь понятно, чем «быстрый интернет» для игр отличается от «быстрого» для скачивания.',w:['Задержка и пропускная способность','время в пути одного пакета (мс) и объём данных в секунду (Мбит/с).'],act:async()=>{const st=SC.st;if(st.slots.length<4){st.slots=[2,1,4,3];st.sorted=true;}note('a',['задержка: 5–40 мс'],'info','top');note('c',['пропускная способность: 100 Мбит/с'],'info','bottom');draw();await wait(400);}}],
 check:[{type:'order',q:'Расставьте этапы передачи по порядку',o:['Сообщение режется на пакеты','К пакетам добавляются заголовки','Пакеты идут по сети разными путями','Получатель собирает сообщение по номерам'],ex:'Сначала режем, потом подписываем, потом отправляем, и только у получателя собираем.'},{q:'Пакет 3 из 4 потерялся в пути. Что нужно переслать?',o:['Все 4 пакета','Только пакет 3','Ничего: сообщение и так понятно'],a:1,ex:'В этом и смысл пакетов: повторно отправляется только потерянная часть.'}]},
m1l1:{mod:1,t:'Сетевая карта и среда передачи',scene:'media',goals:['Узнать, что такое сетевая карта','Различать кабель, Wi-Fi и оптоволокно','Понимать, что значит скорость подключения'],
 task:['Чем устройство «выталкивает» биты наружу?','Пакеты готовы. Но телефон — это процессор и память, они не умеют посылать радиоволны и импульсы в провод.','Какая деталь превращает биты в сигнал и по чему этот сигнал движется?'],
 idea:['Голос и воздух','Чтобы вас услышали, нужны голосовые связки и воздух, по которому идёт звук. У компьютера роль связок играет сетевая карта, а роль воздуха — среда передачи: медный кабель, радиоэфир или стеклянное волокно.','На схеме три пары устройств, каждая соединена своей средой передачи.'],
 beats:[
 {say:'У каждого устройства в сети есть <b>сетевая карта</b>, или сетевой адаптер. Она превращает биты в сигнал и обратно. В ноутбуке это микросхема с разъёмом для кабеля, в телефоне — радиомодуль Wi-Fi.',what:'Найдены сетевые карты устройств.',who:'Ноутбук и телефон.',ch:'Понятно, где биты превращаются в сигнал.',w:['Сетевая карта','устройство, которое превращает биты в сигнал и обратно; другое название — сетевой адаптер.'],act:async()=>{const st=SC.st;st.act=['laptop','phone'];st.sub={laptop:'сетевая карта Ethernet',phone:'сетевая карта Wi-Fi'};draw();await wait(500);}},
 {say:'<b>Витая пара</b> — медный кабель из восьми проводов, скрученных попарно. Биты идут по нему импульсами напряжения, а скручивание защищает от помех. Длина одного кабеля — до 100 метров.',what:'Биты переданы по медному кабелю.',who:'Ноутбук → роутер.',ch:'Импульсы напряжения доставили 8 бит.',w:['Витая пара','медный сетевой кабель с разъёмом RJ-45; работает на расстоянии до 100 м.'],act:async()=>{SC.st.act=[];draw();await bits('laptop','r1','cable');}},
 {say:'<b>Wi-Fi</b> передаёт биты радиоволнами на частотах 2,4, 5 или 6 ГГц. Эфир общий: сигнал телефона слышат все устройства поблизости. Это удобно, но медленнее и менее надёжно, чем кабель.',what:'Телефон передал биты радиоволнами.',who:'Телефон → точка доступа; сигнал слышен всем вокруг.',ch:'Сигнал распространился во все стороны, а не только к точке доступа.',w:['Wi-Fi','беспроводная сеть, передающая данные радиоволнами.'],act:async()=>{await wave('phone');mark('ap','ok','принял');draw();}},
 {say:'<b>Оптоволокно</b> передаёт биты вспышками света по тонкой стеклянной нити. Свет почти не ослабевает и не боится электрических помех, поэтому по оптике идут магистрали провайдеров и подводные кабели между континентами.',what:'Биты переданы светом.',who:'Роутер → провайдер.',ch:'Вспышки света доставили те же 8 бит.',w:['Оптоволокно','кабель, передающий данные светом; работает на десятки километров.'],act:async()=>{clearMarks();draw();await bits('r2','isp','fiber');}},
 {say:'У любого подключения есть <b>скорость</b> — сколько бит в секунду проходит через сетевую карту. Обычные значения: 1 Гбит/с у кабеля, сотни Мбит/с у Wi-Fi, от 1 до 100 Гбит/с и выше у оптики провайдеров.',what:'Сравнены скорости трёх сред.',who:'Все три подключения.',ch:'Понятно, почему магистрали строят из оптики, а дома используют медь и Wi-Fi.',w:['Скорость подключения','число бит в секунду: 1 Гбит/с = 1000 Мбит/с.'],act:async()=>{note('r1',['1 Гбит/с'],'info','top');note('ap',['300–1200 Мбит/с'],'info','top');note('isp',['10–100 Гбит/с'],'info','top');draw();await wait(400);}}],
 check:[{q:'Почему соседние устройства «слышат» сигнал Wi-Fi вашего телефона?',o:['Роутер пересылает им всё','Радиоэфир общий для всех устройств поблизости','Так настроен телефон'],a:1,ex:'Радиоволны расходятся во все стороны. Что делать с услышанным, каждое устройство решает само — об этом следующий урок.'},{q:'Какая среда передачи соединяет континенты?',o:['Витая пара','Wi-Fi','Оптоволокно'],a:2,ex:'Только свет в стекле проходит десятки километров без сильного ослабления.'}]},
m1l2:{mod:1,t:'MAC-адрес',stage:'mac',hasTry:true,goals:['Узнать, что такое MAC-адрес и как он устроен','Научиться читать шестнадцатеричную запись','Найти MAC-адрес своего устройства'],
 task:['Как понять, кому предназначены биты?','В квартире телефон, ноутбук и телевизор. Радиосигнал слышат все трое.','Как каждое устройство поймёт, что сообщение адресовано именно ему?'],
 idea:['Имя на конверте','В общежитии письма оставляют на общем столе, и каждый ищет конверт со своим именем. Чужие письма не вскрывают. MAC-адрес — это «имя» сетевой карты, которое ей дал производитель.','Дальше разберём, как устроено это «имя».'],
 beats:[
 {say:'Каждая сетевая карта получает при изготовлении уникальный номер — <b>MAC-адрес</b>. Он состоит из 6 байт и записывается шестью парами символов через двоеточие.',what:'Показан MAC-адрес ноутбука.',who:'Сетевая карта ноутбука.',ch:'У устройства появилось «имя» для локальной сети.',w:['MAC-адрес','аппаратный адрес сетевой карты: 48 бит, например 3c:84:6a:1f:0b:22.']},
 {say:'Здесь используется <b>шестнадцатеричная запись</b>: цифры 0–9 и буквы a–f, где a = 10, а f = 15. Одна пара символов — ровно один байт. Так длинный двоичный номер записывается коротко.',what:'Первый байт переведён в десятичную и двоичную запись.',who:'—',ch:'Понятно, что 3c — это число 60, или 0011 1100.',w:['Шестнадцатеричная запись','запись чисел цифрами 0–9 и буквами a–f; одна пара символов — один байт.']},
 {say:'Первые три байта — <b>код производителя</b> сетевой карты, последние три — номер конкретной карты. Так производители не повторяют адреса друг друга.',what:'Адрес разделён на две части.',who:'—',ch:'Видно, кто выпустил карту и какой у неё номер.',w:['Код производителя (OUI)','первые 3 байта MAC-адреса, закреплённые за производителем.']},
 {say:'Один адрес особенный: <b>ff:ff:ff:ff:ff:ff</b>, все биты равны единице. Кадр с таким адресом получателя предназначен всем устройствам сети. Это широковещательный адрес, он понадобится в модуле 2.',what:'Показан широковещательный адрес.',who:'Все устройства локальной сети.',ch:'Есть способ обратиться сразу ко всем.',w:['Широковещательный адрес','ff:ff:ff:ff:ff:ff — «всем устройствам в сети».']},
 {say:'Современные телефоны для приватности придумывают для каждой сети Wi-Fi <b>случайный MAC-адрес</b>. Поэтому адрес вашего телефона дома и в кафе разный, и по нему сложнее отследить, где вы бывали.',what:'Показаны два случайных адреса одного телефона.',who:'Телефон.',ch:'MAC-адрес не всегда «заводской».',w:['Случайный MAC-адрес','адрес, который телефон придумывает сам для конкретной сети Wi-Fi.'],pro:'Случайный адрес отмечается вторым младшим битом первого байта. У 9a (1001 1010) он равен 1 — адрес «назначен локально». У заводского 3c (0011 1100) этот бит равен 0.'}],
 check:[{q:'Сколько байт в MAC-адресе?',o:['4','6','8'],a:1,ex:'Шесть пар символов — шесть байт, или 48 бит.'},{q:'Кадр адресован ff:ff:ff:ff:ff:ff. Кто его примет?',o:['Только роутер','Все устройства локальной сети','Никто'],a:1,ex:'Это широковещательный адрес: такой кадр принимают все устройства сети.'}]},
m2l1:{mod:2,t:'Кадр',scene:'frame',goals:['Узнать, из чего состоит кадр','Понять, как получатель узнаёт «свой» кадр','Понять, как обнаруживаются ошибки'],
 task:['Как B поймёт, что сообщение для него и что оно цело?','Два компьютера соединены одним кабелем. A хочет передать B слово «привет».','Как B поймёт, где начинается сообщение, что оно адресовано ему и что помехи его не испортили?'],
 idea:['Посылка с накладной','На посылку клеят накладную: кому, от кого, что внутри. А на коробке пломба: если она сорвана, посылку не принимают. Кадр устроен так же.','На схеме вверху — устройство кадра, внизу — два компьютера на одном кабеле.'],
 beats:[
 {say:'Данные в локальной сети передаются <b>кадрами</b>. A собирает кадр: впереди заголовок с адресами, затем данные, в конце — контрольная сумма. Поля кадра подсвечиваются по очереди.',what:'Компьютер A собрал кадр.',who:'Компьютер A.',ch:'Слово «привет» упаковано в кадр.',w:['Кадр','единица передачи в локальной сети: заголовок, данные и контрольная сумма.'],act:async()=>{const st=SC.st;st.act=['A'];for(let i=0;i<5;i++){st.fields=[i];draw();await wait(650);}st.fields=[0,1,2,3,4];draw();}},
 {say:'Заголовок начинается с <b>MAC-адреса получателя</b>, затем идёт MAC-адрес отправителя и тип содержимого. Получатель стоит первым, чтобы сетевая карта сразу поняла, её ли это кадр, и не тратила время на остальное.',what:'Рассмотрен заголовок кадра.',who:'—',ch:'Понятно, куда смотрит сетевая карта в первую очередь.',w:['Заголовок кадра','MAC получателя (6 байт), MAC отправителя (6 байт), тип данных (2 байта).'],act:async()=>{SC.st.fields=[0,1,2];draw();await wait(300);}},
 {say:'В конце кадра — <b>контрольная сумма FCS</b>. Это число, вычисленное из всего содержимого кадра. Получатель вычисляет его заново: если числа не совпали, значит, по дороге биты исказились.',what:'Рассмотрена контрольная сумма.',who:'—',ch:'Понятно, как обнаружить повреждение.',w:['Контрольная сумма (FCS)','4 байта в конце кадра для проверки, что данные не повреждены.'],pro:'FCS вычисляется по алгоритму CRC-32. Он гарантированно находит любые одиночные ошибки и почти все пачки ошибок.',act:async()=>{SC.st.fields=[4];draw();await wait(300);}},
 {say:'Кадр отправлен. B видит, что MAC получателя совпадает с его собственным, пересчитывает контрольную сумму — совпала. Кадр <b>принят</b>, «привет» передаётся программе.',what:'Кадр доставлен и принят.',who:'A отправил, B принял.',ch:'B получил слово «привет».',act:async()=>{const st=SC.st;st.fields=[];clearMarks();st.act=['A'];draw();await moveFrame('A','B',{label:'привет'});st.act=['B'];mark('B','ok','MAC мой, FCS верна — принял');draw();}},
 {say:'Теперь помеха: рядом с кабелем включили мощный двигатель, и несколько бит исказились. B пересчитывает контрольную сумму — не совпала. Испорченный кадр <b>молча отбрасывается</b>.',what:'Кадр повреждён помехой и отброшен.',who:'A отправил, B отбросил.',ch:'Данные не дошли; повторную отправку организуют верхние уровни.',w:['Отбрасывание кадра','получатель удаляет повреждённый кадр без ответа отправителю.'],pro:'Канальный уровень Ethernet не пересылает потерянные кадры. Повторной отправкой займётся TCP — модуль 7.',act:async()=>{const st=SC.st;clearMarks();st.act=['A'];draw();await moveFrame('A','B',{label:'привет',corruptAt:.5});st.act=['B'];mark('B','bad','FCS не совпала — отбросил');draw();}}],
 check:[{q:'Зачем MAC-адрес получателя стоит в самом начале кадра?',o:['Так принято, причины нет','Чтобы карта сразу решила, принимать ли кадр','Потому что он длиннее остальных полей'],a:1,ex:'Сетевая карта читает первые 6 байт и сразу понимает, нужен ли ей кадр.'},{q:'Контрольная сумма не совпала. Что сделает получатель?',o:['Исправит ошибку сам','Отбросит кадр','Перешлёт кадр дальше'],a:1,ex:'Повреждённый кадр отбрасывается. Ethernet не исправляет ошибки, а только обнаруживает их.'}]},
m2l2:{mod:2,t:'Концентратор и коммутатор',scene:'lan',goals:['Понять, как соединить больше двух компьютеров','Отличать концентратор от коммутатора','Понять, как коммутатор заполняет таблицу'],
 task:['Как соединить четыре компьютера?','Компьютеров уже четыре. Один кабель не разделишь на четыре конца — нужно устройство в центре.','Как сделать так, чтобы кадр от A к C не мешал B и D?'],
 idea:['Глашатай и почтальон','Глашатай выкрикивает каждое письмо на площади — слышат все, даже те, кому оно не нужно. Почтальон сначала узнаёт, кто где живёт, а потом носит письма прямо в нужную дверь.','На схеме четыре компьютера подключены кабелями к устройству в центре. Цифры у кабелей — номера портов.'],
 beats:[
 {say:'Начнём со старого устройства — <b>концентратора</b>, или хаба. Он не читает кадры: всё, что пришло в один порт, он повторяет во все остальные. A отправляет кадр для C.',what:'Концентратор повторил кадр во все порты.',who:'A отправил; B, C и D получили; принял только C.',ch:'Чужой кадр дошёл до B и D.',w:['Концентратор (хаб)','устройство, которое повторяет каждый сигнал во все порты; сейчас почти не используется.'],act:async()=>{SC.st.mode='hub';draw();await lanSend('A','C');}},
 {say:'B и D потратили время на чужой кадр. Хуже другое: пока один говорит, остальные должны молчать. Если двое передают одновременно, сигналы сталкиваются и оба кадра портятся — это <b>коллизия</b>.',what:'B и D передали одновременно, сигналы столкнулись.',who:'B и D.',ch:'Оба кадра испорчены, их придётся отправить заново.',w:['Коллизия','столкновение сигналов, когда два устройства передают одновременно в общей среде.'],act:async()=>{SC.st.mode='hub';await collide();}},
 {say:'Заменим концентратор <b>коммутатором</b>, или свитчем. Коммутатор читает заголовок кадра и ведёт таблицу: какой MAC-адрес находится за каким портом. Сейчас таблица пуста — она вверху схемы.',what:'Концентратор заменён коммутатором.',who:'Коммутатор.',ch:'Появилась таблица MAC-адресов, пока пустая.',w:['Коммутатор (свитч)','устройство, которое пересылает кадр только в порт получателя, если знает его.'],act:async()=>{const st=SC.st;st.mode='switch';st.table=[];clearMarks();st.act=['sw'];draw();await wait(500);}},
 {say:'A отправляет кадр для C. Коммутатор записывает: адрес A — за портом 1. Адрес C ему пока неизвестен, поэтому кадр <b>рассылается во все порты</b>, кроме того, откуда пришёл.',what:'Коммутатор запомнил A и разослал кадр.',who:'A отправил; коммутатор разослал в порты 2, 3, 4.',ch:'В таблице появилась первая строка: A → порт 1.',w:['Таблица MAC-адресов','записи «MAC-адрес → порт», которые коммутатор составляет сам по адресам отправителей.'],act:async()=>{const st=SC.st;st.mode='switch';st.table=[];await lanSend('A','C');}},
 {say:'C отвечает A. Коммутатор записывает адрес C за портом 3. Адрес A он уже знает, поэтому отправляет ответ <b>только в порт 1</b>. B и D ничего не получают.',what:'Ответ ушёл только в один порт.',who:'C отправил, A принял.',ch:'В таблице две строки: A → 1, C → 3.',act:async()=>{await lanSend('C','A');}},
 {say:'Ещё один кадр от A к C. Теперь коммутатор знает оба адреса и отправляет кадр только в порт 3. Сеть стала тише, а разные пары компьютеров могут разговаривать одновременно, не мешая друг другу.',what:'Кадр сразу ушёл по адресу.',who:'A отправил, C принял.',ch:'Коллизий больше нет: у каждого компьютера свой порт.',w:['Полный дуплекс','передача в обе стороны одновременно; в сети на коммутаторах коллизий нет.'],pro:'Записи в таблице стареют: если от адреса долго нет кадров, обычно около 5 минут, запись удаляется.',act:async()=>{await lanSend('A','C');}}],
 check:[{q:'Коммутатор получил кадр для адреса, которого нет в его таблице. Что он сделает?',o:['Отбросит кадр','Разошлёт кадр во все порты, кроме входящего','Спросит адрес у роутера'],a:1,ex:'Неизвестному получателю кадр рассылается во все порты. Когда получатель ответит, коммутатор запомнит и его.'},{q:'Откуда коммутатор берёт адреса для таблицы?',o:['Их вводит администратор','Из адресов отправителей в проходящих кадрах','Из интернета'],a:1,ex:'Коммутатор учится сам: смотрит, из какого порта пришёл кадр и какой в нём адрес отправителя.'}]},

 theory:{sec:[
 ['Зачем нужен MAC-адрес','В локальной сети устройства слышат общие сигналы. MAC-адрес в начале каждого кадра позволяет сетевой карте сразу понять, ей ли он.'],

 ex:['Перевод из шестнадцатеричной записи',['a = 10, b = 11, c = 12, d = 13, e = 14, f = 15','3c = 3 × 16 + 12 = 60','ff = 15 × 16 + 15 = 255']]},

Object.assign(LS.m2l1,{theory:{sec:[
 ['Что такое кадр','Кадр — единица передачи на канальном уровне (L2). Он доставляется только до ближайшего устройства: соседнего компьютера, коммутатора или роутера.'],
 ['Поля заголовка','MAC получателя (6 байт), MAC отправителя (6 байт), тип (2 байта) — какой протокол внутри: 0x0800 — IPv4, 0x0806 — ARP, 0x86DD — IPv6.'],
 ['Размер и MTU','Данные — от 46 до 1500 байт. Предел в 1500 байт называют MTU. Если данных меньше 46 байт, кадр дополняется нулями.'],
 ['Контрольная сумма','FCS (4 байта) считается по алгоритму CRC-32. Ethernet только находит ошибки, но не исправляет их: испорченный кадр отбрасывается.']],
 ex:['Минимальный и максимальный кадр',['14 + 46 + 4 = 64 байта','14 + 1500 + 4 = 1518 байт']]},

 {t:'input',q:'Какой максимальный размер кадра Ethernet в байтах (заголовок + данные + FCS)?',a:['1518'],hint:'14 + 1500 + 4.',ex:'1518 байт.'},
 {t:'sort',q:'Что сделает компьютер B (MAC …:02) с кадром?',cats:['Примет','Отбросит'],items:[['Получатель …:02, FCS верна',0],['Получатель …:03, FCS верна',1],['Получатель ff:ff:ff:ff:ff:ff, FCS верна',0],['Получатель …:02, FCS не совпала',1]],ex:'Принимается кадр «мне или всем» с верной контрольной суммой.'},
 {t:'choice',q:'В кадре тип 0x0806. Что внутри?',o:['IPv4-пакет','ARP-сообщение','Видео'],a:1,ex:'0x0806 — ARP, о нём модуль 3.'}]});

LS.m3l1={mod:3,t:'IP-адрес и маска',goals:['Понять, зачем нужен второй адрес','Разобрать устройство IPv4-адреса и маски','Научиться определять «своя сеть или чужая»'],
 task:['Как найти устройство в другой сети?','MAC-адрес помогает внутри одной квартиры. Но сервер RideNow находится в другом городе, в чужой сети, и его MAC-адрес вам никто не сообщит.','Как адресовать устройство так, чтобы его можно было найти из любой точки мира?'],
 idea:['Почтовый адрес','Письмо доходит не потому, что почтальон знает всех жителей Земли, а потому что адрес иерархичен: страна, город, улица, дом. Сортировщик смотрит только на нужную ему часть. IP-адрес устроен так же: сначала номер сети, затем номер устройства в ней.','На схеме две сети — 192.168.1.0 и 192.168.2.0 — и роутер между ними.'],
 scene:{nodes:{A:nd(120,140,'laptop','Ноутбук A','192.168.1.10'),B:nd(120,420,'pc','Компьютер B','192.168.1.20'),s1:nd(270,280,'sw','Коммутатор'),R:nd(450,280,'router','Роутер','.1.1 | .2.1'),s2:nd(630,280,'sw','Коммутатор'),C:nd(780,140,'pc','Компьютер C','192.168.2.30'),D:nd(780,420,'pc','Принтер','192.168.2.40')},
  links:[lk('A','s1'),lk('B','s1'),lk('s1','R'),lk('R','s2'),lk('s2','C'),lk('s2','D')],zones:[[20,40,400,480,'сеть 192.168.1.0/24'],[480,40,400,480,'сеть 192.168.2.0/24']]},
 beats:[
 {say:'MAC-адрес «плоский»: по нему нельзя понять, где устройство. Поэтому у каждого устройства есть второй адрес — <b>IP-адрес</b>. Он устроен как почтовый: сначала «город и улица» — номер сети, затем «дом» — номер устройства.',what:'У каждого устройства появился IP-адрес.',who:'Все устройства двух сетей.',ch:'Устройства можно различать не только по MAC.',w:['IP-адрес','логический адрес устройства; в IPv4 — четыре числа от 0 до 255, например 192.168.1.10.'],act:async()=>{actv('A','B','C','D');draw();await wait(600);}},
 {say:'IPv4-адрес состоит из 32 бит — четырёх байтов. Их записывают десятичными числами через точку, и каждое число называют <b>октетом</b>. На схеме — адрес ноутбука A в двоичном виде.',what:'Адрес A показан в десятичной и двоичной записи.',who:'Ноутбук A.',ch:'Видно, что 192.168.1.10 — это 32 нуля и единицы.',w:['Октет','одно из четырёх чисел IPv4-адреса: 8 бит, значение 0–255.'],act:async()=>{reset2();actv('A');note('A',['192.168.1.10 =','11000000.10101000.00000001.00001010'],'info','bottom',1);draw();await wait(500);}},
 {say:'Какая часть адреса — сеть, а какая — устройство, задаёт <b>маска</b>. Запись /24 означает: первые 24 бита (три октета) — номер сети, остальные 8 — номер устройства. A и B в сети 192.168.1, а C и принтер — в сети 192.168.2.',what:'Адрес разделён на номер сети и номер устройства.',who:'Все устройства.',ch:'Видно, кто с кем в одной сети.',w:['Маска подсети','показывает, какая часть IP-адреса — номер сети; /24 = 255.255.255.0.'],act:async()=>{reset2();tbl('mask',300,14,300,'Маска /24 = 255.255.255.0',[['сеть','192.168.1'],['устройство','.10']],[130,160]);draw();await wait(500);}},
 {say:'A отправляет данные B. Сравниваем номера сетей: 192.168.1 и 192.168.1 совпали — B в той же сети. Значит, можно отправить напрямую через коммутатор, роутер не нужен.',what:'Пакет доставлен внутри сети.',who:'A, коммутатор, B.',ch:'Роутер не участвовал.',act:async()=>{reset2();SC.st.tables=[];actv('A');draw();await walk(['A','s1','B'],{label:'A → B'});mark('B','ok','та же сеть — напрямую');draw();}},
 {say:'Теперь A пишет C. Номер сети C — 192.168.2, он другой. Напрямую нельзя: A отдаёт пакет <b>шлюзу</b> — роутеру, а тот передаёт его в соседнюю сеть.',what:'Пакет прошёл через роутер в другую сеть.',who:'A, роутер, C.',ch:'Роутер соединил две сети.',w:['Шлюз по умолчанию','роутер, которому устройство отдаёт все пакеты для других сетей.'],act:async()=>{reset2();actv('A');draw();await walk(['A','s1','R'],{label:'A → C'});mark('R','info','шлюз: передаю в 192.168.2.0');draw();await walk(['R','s2','C'],{label:'A → C'});mark('C','ok','принял');draw();}},
 {say:'Сколько устройств помещается в сеть /24? На номер устройства остаётся 8 бит — 256 вариантов. Два заняты: .0 — адрес самой сети, .255 — широковещательный. Остаётся 254 адреса.',what:'Посчитана ёмкость сети.',who:'—',ch:'Видно, сколько устройств поместится в домашнюю сеть.',w:['Адрес сети и широковещательный адрес','первый (.0) и последний (.255) адреса сети /24; устройствам их не выдают.'],pro:'Число адресов для устройств = 2^(32 − префикс) − 2. Для /26 это 62, для /30 — 2.',act:async()=>{reset2();tbl('cnt',300,14,300,'Сеть 192.168.1.0/24',[['адрес сети','192.168.1.0'],['устройства','.1 … .254'],['всем','192.168.1.255']],[130,160]);draw();await wait(400);}}],
 theory:{sec:[

LS.m3l2={mod:3,t:'ARP: от IP к MAC',goals:['Понять, как связаны IP- и MAC-адреса','Увидеть ARP-запрос и ответ','Понять, чей MAC нужен для выхода в интернет'],

 idea:['Перекличка в классе','Новый учитель знает фамилию ученика, но не знает его в лицо. Он спрашивает весь класс: «Кто здесь Петров?» — и Петров поднимает руку. Учитель запоминает, где он сидит, и больше не спрашивает.','На схеме домашняя сеть: телефон, ноутбук, телевизор и роутер, соединённые через коммутатор.'],
 scene:{nodes:{phone:nd(130,280,'phone','Телефон','192.168.1.23'),lap:nd(450,110,'laptop','Ноутбук','192.168.1.31'),tv:nd(450,450,'tv','Телевизор','192.168.1.40'),sw:nd(450,280,'sw','Коммутатор'),R:nd(760,280,'router','Роутер','192.168.1.1')},

 beats:[
 {say:'Телефон знает IP-адрес получателя, но кадр в локальной сети доставляется по MAC-адресу. Как узнать MAC по IP? Для этого есть протокол <b>ARP</b>. У телефона есть ARP-таблица — пока пустая.',what:'Показана пустая ARP-таблица телефона.',who:'Телефон.',ch:'Видно, что MAC-адресов соседей телефон пока не знает.',w:['ARP','протокол, который по IP-адресу соседа находит его MAC-адрес.'],act:async()=>{tbl('arp',20,14,340,'ARP-таблица телефона',[],[150,190]);actv('phone');draw();await wait(400);}},
 {say:'Телефон хочет связаться с ноутбуком 192.168.1.31 — это та же сеть. Записи в таблице нет, поэтому он рассылает всем широковещательный вопрос: «У кого 192.168.1.31? Ответьте 192.168.1.23».',what:'ARP-запрос разослан всем устройствам.',who:'Телефон спрашивает; ноутбук, телевизор и роутер слышат.',ch:'Все устройства сети получили вопрос.',w:['ARP-запрос','широковещательный вопрос «у кого этот IP-адрес?».'],act:async()=>{reset2();actv('phone');draw();await moveFrame('phone','sw',{kind:'bc',label:'кто 192.168.1.31?'});await Promise.all(['lap','tv','R'].map(d=>moveFrame('sw',d,{kind:'bc',label:'кто .31?'})));mark('tv','drop','не мой IP');mark('R','drop','не мой IP');mark('lap','ok','это я!');draw();}},
 {say:'Ноутбук отвечает только телефону: «192.168.1.31 — это я, мой MAC 5c:ab:22:10:9f:31». Телефон записывает пару в ARP-таблицу и теперь может отправлять кадры ноутбуку.',what:'Получен MAC ноутбука.',who:'Ноутбук отвечает телефону.',ch:'В ARP-таблице первая запись.',w:['ARP-таблица','список «IP → MAC», который устройство хранит от нескольких секунд до нескольких минут.'],act:async()=>{reset2();draw();await walk(['lap','sw','phone'],{kind:'resp',label:'это я: 5c:ab:…'});tbl('arp',20,14,340,'ARP-таблица телефона',[['192.168.1.31','5c:ab:22:10:9f:31']],[150,190],[0]);draw();}},
 {say:'Теперь телефон открывает сайт 104.21.7.44. Это <b>чужая сеть</b>, поэтому MAC сервера ему не нужен и недоступен. Он спрашивает MAC <b>шлюза</b>: «У кого 192.168.1.1?» — отвечает роутер.',what:'Получен MAC роутера.',who:'Телефон и роутер.',ch:'В таблице две записи: ноутбук и шлюз.',act:async()=>{reset2();draw();await moveFrame('phone','sw',{kind:'bc',label:'кто 192.168.1.1?'});await Promise.all(['lap','tv','R'].map(d=>moveFrame('sw',d,{kind:'bc',label:'кто .1?'})));mark('lap','drop','не мой IP');mark('tv','drop','не мой IP');mark('R','ok','это я');draw();await walk(['R','sw','phone'],{kind:'resp',label:'3c:84:6a:…'});tbl('arp',20,14,340,'ARP-таблица телефона',[['192.168.1.31','5c:ab:22:10:9f:31'],['192.168.1.1','3c:84:6a:1f:0b:22']],[150,190],[1]);draw();}},
 {say:'Телефон собирает пакет: в IP-заголовке получатель — сервер 104.21.7.44, а в заголовке кадра — MAC роутера. IP-адрес указывает конечную цель, MAC — следующий шаг. Пакет едет внутри кадра, как письмо в конверте.',what:'Пакет для интернета отправлен шлюзу.',who:'Телефон → роутер.',ch:'Понятно, как адреса L2 и L3 работают вместе.',w:['Инкапсуляция','вложение пакета одного уровня в «конверт» другого: IP-пакет едет внутри кадра Ethernet или Wi-Fi.'],pro:'Посмотреть ARP-таблицу: arp -a. ARP не проверяет подлинность ответов — на этом построена атака ARP-spoofing в общих сетях.',act:async()=>{reset2();actv('phone');draw();await walk(['phone','sw','R'],{label:'IP 104.21.7.44'});note('R',['кадр: MAC роутера','пакет: IP 104.21.7.44'],'info','bottom',1);mark('R','ok','принял, передаю в интернет');draw();}}],
 theory:{sec:[
 ['Зачем нужен ARP','IP-адрес выбирает программа, а сетевая карта отправляет кадры по MAC. ARP связывает их: превращает известный IP соседа в его MAC.'],
 ['Как идёт обмен','Запрос — широковещательный (ff:ff:ff:ff:ff:ff), его получают все. Отвечает только владелец адреса, и только спросившему. Ответ хранится в ARP-таблице.'],
 ['Для чужой сети — MAC шлюза','Если получатель в другой сети, ARP спрашивает адрес шлюза. MAC-адрес сервера в интернете ваш телефон не узнает никогда — он и не нужен.'],
 ['Для специалиста','ARP работает только в IPv4. В IPv6 ту же задачу решает протокол NDP. ARP не проверяет подлинность ответов — на этом построены атаки ARP-spoofing.']],

LS.m3l3={mod:3,t:'DHCP и виды адресов',goals:['Разобрать четыре шага DHCP','Различать частные и публичные адреса','Узнать особые адреса и IPv6'],
 task:['Откуда берётся адрес?','Вы приходите в гости, подключаетесь к Wi-Fi, и через секунду всё работает. Никто не вписывал вам IP-адрес, маску и шлюз.','Кто и как выдаёт устройству сетевые настройки?'],
 idea:['Ресепшен в гостинице','Гость не выбирает номер сам. Он подходит к стойке, администратор выдаёт свободный номер и ключ на время проживания, а при выезде номер освобождается. DHCP-сервер — такой администратор для адресов.','На схеме домашняя сеть, в роутере работает DHCP-сервер, справа — провайдер.'],
 scene:{nodes:{phone:nd(120,280,'phone','Телефон','адреса нет'),lap:nd(380,110,'laptop','Ноутбук','192.168.1.31'),tv:nd(380,450,'tv','Телевизор','192.168.1.40'),sw:nd(380,280,'sw','Коммутатор'),R:nd(620,280,'router','Роутер','DHCP-сервер'),isp:nd(810,280,'globe','Провайдер')},
  links:[lk('phone','sw'),lk('lap','sw'),lk('tv','sw'),lk('sw','R'),lk('R','isp','fiber')],zones:[[20,40,700,480,'дом · 192.168.1.0/24']]},
 beats:[
 {say:'Вписывать адрес, маску и шлюз в каждое устройство вручную долго, и легко ошибиться. Поэтому настройки раздаёт <b>DHCP-сервер</b> — дома он встроен в роутер. Подключаем новый телефон.',what:'Телефон подключился к сети, но адреса у него нет.',who:'Телефон.',ch:'Телефону нужны сетевые настройки.',w:['DHCP','протокол автоматической выдачи сетевых настроек: адреса, маски, шлюза и DNS.'],act:async()=>{actv('phone','R');draw();await wait(400);}},
 {say:'Шаг 1, <b>Discover</b>. Адреса нет, сервер неизвестен, поэтому телефон рассылает всем: «Есть ли здесь DHCP-сервер?» Отправитель — 0.0.0.0, получатель — 255.255.255.255.',what:'Запрос разослан всем устройствам.',who:'Телефон; ответит только роутер.',ch:'DHCP-сервер узнал о новом клиенте.',w:['DHCP Discover','первое сообщение: клиент ищет DHCP-сервер.'],act:async()=>{reset2();draw();await moveFrame('phone','sw',{kind:'bc',label:'DISCOVER'});await Promise.all(['lap','tv','R'].map(d=>moveFrame('sw',d,{kind:'bc',label:'DISCOVER'})));mark('lap','drop','не сервер');mark('tv','drop','не сервер');mark('R','ok','я DHCP-сервер');draw();}},
 {say:'Шаг 2, <b>Offer</b>. Роутер выбирает свободный адрес из своего диапазона и предлагает: «Бери 192.168.1.23, маска /24, шлюз 192.168.1.1, DNS 1.1.1.1».',what:'Получено предложение настроек.',who:'Роутер → телефон.',ch:'Телефон знает, какой адрес ему предлагают.',w:['DHCP Offer','предложение адреса и остальных настроек.'],act:async()=>{reset2();draw();await walk(['R','sw','phone'],{kind:'resp',label:'OFFER .23'});tbl('off',20,14,300,'Предложение DHCP',[['адрес','192.168.1.23'],['маска','255.255.255.0'],['шлюз','192.168.1.1'],['DNS','1.1.1.1']],[100,200]);draw();}},
 {say:'Шаги 3 и 4, <b>Request</b> и <b>Ack</b>. Телефон отвечает «беру этот адрес», роутер подтверждает аренду на 24 часа. Четыре сообщения вместе называют <b>DORA</b>.',what:'Адрес закреплён за телефоном.',who:'Телефон и роутер.',ch:'У телефона есть адрес 192.168.1.23.',w:['Аренда адреса','срок, на который выдан адрес; до его окончания устройство продлевает аренду.'],act:async()=>{reset2();draw();await walk(['phone','sw','R'],{kind:'ctrl',label:'REQUEST'});await walk(['R','sw','phone'],{kind:'resp',label:'ACK'});SC.st.sub.phone='192.168.1.23';mark('phone','ok','адрес получен');draw();}},
 {say:'Адреса 192.168.x.x работают только внутри дома — это <b>частные</b> адреса. В интернете роутер виден под одним <b>публичным</b> адресом, который ему выдал провайдер — тоже по DHCP.',what:'Показаны два адреса роутера.',who:'Роутер и провайдер.',ch:'Понятно, почему у дома два вида адресов.',w:['Частный и публичный адрес','частный работает только в локальной сети (10.x, 172.16–31.x, 192.168.x); публичный уникален во всём интернете.'],act:async()=>{reset2();SC.st.tables=[];draw();await moveFrame('R','isp',{kind:'ctrl',label:'DHCP'});await moveFrame('isp','R',{kind:'resp',label:'85.140.12.7'});note('R',['LAN: 192.168.1.1 — частный','WAN: 85.140.12.7 — публичный'],'info','bottom',1);draw();}},
 {say:'IPv4-адресов всего около 4,3 миллиарда — меньше, чем устройств на планете. Решение на будущее — <b>IPv6</b>: адрес из 128 бит, их хватит всем. Пример: 2001:db8:85a3::8a2e:370:7334. Пока обе версии работают параллельно.',what:'Показана новая версия адресов.',who:'—',ch:'Понятно, зачем нужен IPv6.',w:['IPv6','новая версия IP: адрес из 128 бит, записывается шестнадцатеричными группами через двоеточие.'],pro:'Если DHCP-сервер не ответил, Windows назначает себе адрес 169.254.x.x (APIPA). Увидели такой адрес — устройство не получило настройки.',act:async()=>{reset2();note('phone',['IPv4: 192.168.1.23','IPv6: 2001:db8::1a2b'],'info','bottom',1);draw();await wait(300);}}],

 ['DHCP: DORA','Discover → Offer → Request → Ack. Клиент получает IP-адрес, маску, шлюз, адреса DNS-серверов и срок аренды. Работает поверх UDP: порт 67 у сервера, 68 у клиента.'],
 ['Статический или динамический','Динамический адрес выдаёт DHCP, он может меняться. Статический прописывают вручную или закрепляют за MAC-адресом в роутере — так делают для принтеров и камер.'],

 ['Особые адреса','127.0.0.1 — «этот же компьютер» (localhost). 169.254.x.x — DHCP не ответил. 0.0.0.0 — «адреса пока нет». IPv6: ::1 — localhost.']],

 prac:[{t:'sort',q:'Частный или публичный адрес?',cats:['Частный','Публичный'],items:[['192.168.0.15',0],['10.12.0.3',0],['8.8.8.8',1],['172.20.1.1',0],['85.140.12.7',1],['104.21.7.44',1]],ex:'Частные: 10.x, 172.16–31.x, 192.168.x.'},
 {t:'order',q:'Расставьте сообщения DHCP по порядку',o:['Discover','Offer','Request','Ack'],ex:'DORA.'},

 beats:[
 {say:'В каждом IP-пакете есть поле <b>TTL</b> — «время жизни». Отправитель ставит, например, 64. Каждый маршрутизатор уменьшает его на единицу. Если TTL стал 0 — пакет уничтожается. Так пакеты не кружат вечно, если маршруты зациклились.',what:'TTL уменьшается на каждом шаге.',who:'Компьютер и цепочка маршрутизаторов.',ch:'Видно, как убывает TTL.',w:['TTL','Time To Live: счётчик в IP-пакете, уменьшается на 1 каждым маршрутизатором; при нуле пакет уничтожается.'],act:async()=>{reset2();draw();const p=['pc','h1','h2','h3','h4','srv'];for(let i=0;i<p.length-1;i++){await moveFrame(p[i],p[i+1],{label:'TTL '+(64-i),dur:800});}mark('srv','ok','пришёл с TTL 60');draw();}},
 {say:'Уничтожив пакет, маршрутизатор отправляет отправителю сообщение <b>ICMP</b> «время истекло» — и в нём свой адрес. traceroute этим пользуется: первый пакет он шлёт с TTL 1. Его уничтожает первый же роутер — и сообщает свой адрес.',what:'Первый узел найден.',who:'Компьютер и домашний роутер.',ch:'В таблице появилась первая строка.',w:['ICMP','служебный протокол сетевого уровня: сообщает об ошибках («время истекло», «узел недоступен») и используется командой ping.'],act:async()=>{reset2();tbl('tr',300,40,420,'tracert 104.21.7.44',[],[50,190,90]);draw();await moveFrame('pc','h1',{label:'TTL 1',dur:800});boom('h1');await moveFrame('h1','pc',{kind:'resp',label:'ICMP: время истекло',dur:800});tbl('tr',300,40,420,'tracert 104.21.7.44',[['1','192.168.1.1','1 мс']],[50,190,90],[0]);mark('h1','info','TTL кончился у меня');draw();}},
 {say:'Затем TTL 2 — пакет погибает на втором узле, затем TTL 3… Каждый ответ добавляет строку: адрес узла и время туда-обратно. Так шаг за шагом виден весь путь.',what:'Найдены все узлы на пути.',who:'Все маршрутизаторы цепочки.',ch:'Вывод traceroute собран целиком.',act:async()=>{reset2();draw();const p=['pc','h1','h2','h3','h4','srv'],ip=['192.168.1.1','95.1.1.1','195.208.1.1','80.81.192.1','104.21.7.44'],ms=['1 мс','6 мс','9 мс','14 мс','15 мс'];const rows=[['1',ip[0],ms[0]]];for(let t=2;t<=5;t++){await walk(p.slice(0,t+1),{label:'TTL '+t,dur:420});rows.push([String(t),ip[t-1],ms[t-1]]);tbl('tr',300,40,420,'tracert 104.21.7.44',rows.slice(),[50,190,90],[t-1]);draw();}mark('srv','ok','цель достигнута');draw();}},
 {say:'Время в столбце — задержка туда и обратно. Свет в оптоволокне проходит около 200 км за миллисекунду. Скачок с 6 до 9 мс — длинный участок магистрали. Звёздочки «* * *» значат, что узел не ответил: часто это просто запрет на ICMP, а не поломка.',what:'Разобран вывод traceroute.',who:'—',ch:'Понятно, как читать задержки и звёздочки.',w:['Задержка (latency)','время прохождения пакета; в traceroute и ping — время туда и обратно, в миллисекундах.'],pro:'В Windows команда называется tracert, в macOS и Linux — traceroute. В Linux есть удобная mtr: traceroute и ping в одном окне, обновляется непрерывно.',act:async()=>{reset2();TB('tr').hl=[1,2];mark('h3','info','длинный участок');draw();await wait(300);}}],
 theory:{sec:[
 ['TTL','Поле IP-пакета размером 1 байт. Начальное значение: 64 (Linux, macOS, Android), 128 (Windows), 255 (сетевое оборудование). Каждый маршрутизатор уменьшает его на 1.'],
 ['ICMP','Служебные сообщения о проблемах доставки. Тип 11 — «время истекло», тип 3 — «узел недоступен», типы 8 и 0 — эхо-запрос и эхо-ответ (ping).'],
 ['traceroute','Отправляет пакеты с TTL 1, 2, 3… и записывает, кто сообщил о гибели пакета. По три пробы на шаг — отсюда три значения времени в каждой строке.'],
 ['Как читать задержку','Резкий рост на одном шаге — длинная линия или перегруженный узел. Рост, который сохраняется до конца, — реальная проблема. Рост только на одном узле, а дальше снова мало, — узел просто медленно отвечает на ICMP.']],
 ex:['Пример вывода',['1   1 ms   192.168.1.1','2   6 ms   95.1.1.1','3   *  *  *   (узел молчит)','4  14 ms   80.81.192.1']]},
 tryData:{title:'Проследите путь до сайта',intro:'Выполните в терминале — это займёт до минуты.',cmds:[['Windows','tracert ya.ru','Сосчитайте шаги до цели. Первый — ваш роутер.'],['macOS / Linux','traceroute ya.ru','Если команды нет в Linux: sudo apt install traceroute.'],['Сравните','tracert 1.1.1.1','Путь к другому сервису проходит через другие узлы.']],done:'Я увидел(а) путь пакета',side:[['На что смотреть','Первый шаг — шлюз, затем узлы провайдера. Время растёт с расстоянием. Звёздочки — не всегда поломка.']]},

 {t:'sort',q:'Что показывает команда?',cats:['ping','traceroute'],items:[['Доступен ли узел',0],['Через какие узлы идёт путь',1],['Задержку до конечного узла',0],['На каком шаге растёт задержка',1]],ex:'ping — «жив ли», traceroute — «как идём».'}],

 {q:'Какое сообщение получает traceroute от узла?',o:['ICMP «время истекло»','HTTP 404','DHCP OFFER'],a:0,ex:'В нём адрес узла.'},
 {q:'Что означают «* * *» в выводе?',o:['Узел не ответил вовремя','Пакет зашифрован','Путь найден'],a:0,ex:'Часто — просто фильтр ICMP.'},
 {q:'Как называется команда в Windows?',o:['tracert','traceroute','trace'],a:0,ex:'В macOS и Linux — traceroute.'}],

LS.m5l3={mod:5,t:'Провайдеры, BGP и магистрали',goals:['Понять, из чего состоит интернет','Узнать, что такое автономная система и BGP','Разобраться в пиринге и транзите'],
 task:['Кто управляет интернетом?','Интернет — не одна компания. Это десятки тысяч независимых сетей: домашние провайдеры, мобильные операторы, облака, университеты.','Как они договариваются, куда передавать пакеты друг друга?'],
 idea:['Сеть железных дорог','У каждой компании свои пути и вокзалы. На узловых станциях они передают вагоны друг другу. Какие-то компании возят друг друга бесплатно, какие-то платят за проезд по чужим путям. А в расписании указано, куда можно доехать по чьим рельсам.','На схеме четыре сети: ваш провайдер, магистральный оператор, точка обмена трафиком и сеть RideNow.'],
 scene:{nodes:{you:nd(90,280,'router','Ваш провайдер','AS64501'),tr:nd(330,120,'globe','Магистральный оператор','AS64502'),ix:nd(330,430,'sw','Точка обмена (IX)'),cdn:nd(600,430,'globe','Сеть RideNow','AS64503'),oth:nd(600,120,'globe','Другой провайдер','AS64504'),srv:nd(830,280,'server','RideNow','104.21.7.44')},
  links:[lk('you','tr','fiber'),lk('you','ix','fiber'),lk('ix','cdn','fiber'),lk('tr','oth','fiber'),lk('oth','cdn','fiber'),lk('cdn','srv','fiber')],zones:[]},
 beats:[
 {say:'Каждая крупная сеть в интернете — <b>автономная система</b> (AS) со своим номером. У вашего провайдера, у оператора магистрали, у RideNow — свои AS. Внутри AS маршруты строит сам владелец.',what:'Показаны четыре автономные системы.',who:'Провайдеры и сеть RideNow.',ch:'Видно, что интернет — это сеть сетей.',w:['Автономная система (AS)','сеть под единым управлением со своим номером (ASN) и своей политикой маршрутизации.'],act:async()=>{actv('you','tr','cdn','oth');draw();await wait(400);}},
 {say:'Между собой AS обмениваются маршрутами по протоколу <b>BGP</b>. Сеть RideNow объявляет соседям: «сеть 104.21.0.0/16 — у меня». Соседи передают объявление дальше, добавляя свой номер в путь.',what:'Объявление маршрута разошлось по сетям.',who:'RideNow → соседи → ваш провайдер.',ch:'Все узнали, где находится 104.21.0.0/16.',w:['BGP','протокол, которым автономные системы сообщают друг другу, какие сети через них доступны.'],act:async()=>{reset2();draw();await Promise.all([moveFrame('cdn','ix',{kind:'bc',label:'104.21.0.0/16 у меня'}),moveFrame('cdn','oth',{kind:'bc',label:'104.21.0.0/16 у меня'})]);await Promise.all([moveFrame('ix','you',{kind:'bc',label:'путь: 64503'}),moveFrame('oth','tr',{kind:'bc',label:'путь: 64504 64503'})]);await moveFrame('tr','you',{kind:'bc',label:'путь: 64502 64504 64503'});mark('you','ok','знаю два пути');draw();}},
 {say:'У вашего провайдера два пути: прямой через точку обмена и длинный через магистраль. Он выбирает короткий. <b>Точка обмена трафиком</b> (IX) — большой коммутатор, к которому подключены сотни сетей, чтобы обмениваться трафиком напрямую.',what:'Пакет пошёл через точку обмена.',who:'Ваш провайдер, IX, RideNow.',ch:'Выбран короткий путь.',w:['Точка обмена трафиком (IX)','площадка, где сети соединяются напрямую через общий коммутатор.'],act:async()=>{reset2();draw();await walk(['you','ix','cdn','srv'],{label:'→ 104.21.7.44'});mark('srv','ok','быстро и дёшево');draw();}},
 {say:'Прямой обмен через IX обычно бесплатный — это <b>пиринг</b>. А за доставку в «весь остальной интернет» провайдер платит магистральному оператору — это <b>транзит</b>. Между континентами трафик идёт по подводным оптическим кабелям.',what:'Объяснены пиринг и транзит.',who:'—',ch:'Понятна экономика интернета.',w:['Пиринг и транзит','пиринг — взаимный обмен трафиком своих клиентов, обычно без оплаты; транзит — платный доступ ко всему интернету через более крупную сеть.'],pro:'BGP доверяет объявлениям соседей. В 2008 году пакистанский провайдер ошибочно объявил сеть YouTube, и сервис на пару часов пропал по всему миру. Сейчас от таких ошибок защищает проверка подписей маршрутов RPKI.',act:async()=>{reset2();mark('ix','info','пиринг');mark('tr','info','транзит — платно');draw();await wait(300);}}],
 theory:{sec:[
 ['Сеть сетей','Интернет состоит из десятков тысяч автономных систем. Номера AS выдают региональные регистраторы, например RIPE NCC для Европы.'],
 ['BGP','Каждая AS объявляет свои сети соседям. Объявление несёт путь — список AS, через которые оно прошло. Это помогает выбрать маршрут и отбросить петли.'],
 ['Выбор пути','BGP выбирает не самый быстрый, а самый выгодный по политике путь: сначала свои клиенты, потом пиринг, потом платный транзит. Длина пути — один из критериев.'],
 ['Физическая основа','Магистрали — оптоволокно вдоль дорог и железных дорог, между континентами — подводные кабели. По ним проходит почти весь межконтинентальный трафик, спутники — малая доля.']],
 ex:['Объявление BGP',['сеть: 104.21.0.0/16','путь: 64502 64504 64503','следующий шаг: R-магистраль']]},

 {t:'sort',q:'Пиринг или транзит?',cats:['Пиринг','Транзит'],items:[['Два провайдера обмениваются трафиком своих клиентов через IX бесплатно',0],['Местный провайдер платит крупному оператору за выход в весь интернет',1],['Облачная платформа соединяется с мобильным оператором напрямую',0]],ex:'Транзит — платный доступ «ко всему».'},
 {t:'choice',q:'Что такое AS64503 в объявлении?',o:['Номер автономной системы','IP-адрес','Порт'],a:0,ex:'ASN — номер сети в BGP.'},
 {t:'choice',q:'Как основная часть трафика пересекает океаны?',o:['Через спутники','По подводным оптическим кабелям','По радиорелейным линиям'],a:1,ex:'Кабели дешевле и быстрее.'}],
 check:[{q:'Что такое автономная система?',o:['Сеть под единым управлением с номером ASN','Отдельный компьютер','Программа'],a:0,ex:'Провайдер, облако, крупная компания.'},
 {q:'Что передаёт BGP?',o:['Объявления о том, какие сети через кого доступны','Веб-страницы','Пароли'],a:0,ex:'Это протокол маршрутизации между AS.'},
 {q:'Что такое точка обмена трафиком (IX)?',o:['Площадка, где сети соединяются напрямую','Магазин роутеров','DNS-сервер'],a:0,ex:'Большой общий коммутатор.'},
 {q:'Чем транзит отличается от пиринга?',o:['Транзит — платный доступ ко всему интернету','Ничем','Пиринг медленнее'],a:0,ex:'Пиринг — взаимный обмен.'},
 {q:'Что случилось бы без RPKI при ошибочном объявлении чужой сети?',o:['Трафик мог уйти не туда','Ничего','Интернет ускорится'],a:0,ex:'Как с YouTube в 2008 году.'}],

LS.m6l1={mod:6,t:'Как имя превращается в адрес',goals:['Понять, зачем нужен DNS','Пройти рекурсивное разрешение имени по шагам','Понять роль кэша и TTL'],
 task:['Откуда телефон знает адрес сервера?','Приложение обращается к api.ridenow.com, а маршрутизаторы понимают только IP-адреса. Где-то имя должно превратиться в число.','Кто хранит соответствие имён и адресов для всего интернета?'],
 idea:['Справочная служба','Вы звоните в справочную: «Номер ресторана «Ромашка»?». Оператор сам не знает, но знает, у кого спросить: сначала городская справочная, потом районная, потом сам ресторан. Ответ вам сообщают, а оператор записывает его себе на день вперёд.','На схеме телефон, роутер, публичный DNS-резолвер и три уровня DNS-серверов.'],
 scene:{nodes:{phone:nd(80,280,'phone','Телефон'),R:nd(240,280,'router','Роутер','192.168.1.1'),res:nd(440,280,'server','DNS-резолвер','1.1.1.1'),root:nd(700,100,'db','Корневой сервер','.'),tld:nd(800,280,'db','Сервер зоны .com'),ns:nd(700,410,'db','Сервер ridenow.com')},
  links:[lk('phone','R','air'),lk('R','res','fiber'),lk('res','root','fiber'),lk('res','tld','fiber'),lk('res','ns','fiber')],zones:[[600,30,290,500,'серверы DNS']]},
 beats:[
 {say:'<b>DNS</b> — система доменных имён. Это распределённый справочник: каждый сервер знает только свою часть. Телефон спрашивает не их всех, а один <b>резолвер</b> — сервер, который сам пройдёт по цепочке. Здесь это 1.1.1.1.',what:'Показана цепочка DNS.',who:'Телефон, роутер, резолвер, три уровня серверов.',ch:'Видно, кто участвует в поиске адреса.',w:['DNS','Domain Name System: распределённая система, переводящая имена (ridenow.com) в IP-адреса.'],act:async()=>{tbl('cache',20,20,300,'Кэш резолвера',[],[200,100]);actv('res');draw();await wait(400);}},
 {say:'Телефон спрашивает: «Какой адрес у api.ridenow.com?». Резолвер не знает и идёт к <b>корневому серверу</b>. Корень отвечает: «Про .com знает вот этот сервер».',what:'Корневой сервер указал на зону .com.',who:'Резолвер и корневой сервер.',ch:'Первый шаг поиска сделан.',w:['Резолвер','DNS-сервер, который принимает вопрос от клиента и сам опрашивает цепочку серверов.'],act:async()=>{reset2();draw();await walk(['phone','R','res'],{label:'api.ridenow.com ?'});await moveFrame('res','root',{label:'api.ridenow.com ?'});await moveFrame('root','res',{kind:'resp',label:'спроси .com'});mark('root','info','знаю только зоны');draw();}},

 {say:'Через минуту ваш сосед открывает RideNow, и его телефон спрашивает тот же резолвер. Ответ уже в кэше — резолвер отвечает сразу, без обхода цепочки. Кэш делает DNS быстрым: большинство ответов приходят за несколько миллисекунд.',what:'Ответ получен из кэша.',who:'Телефон и резолвер.',ch:'Повторный запрос не потребовал обхода серверов.',pro:'Если сайт переехал на новый адрес, старый ответ живёт в кэшах до истечения TTL. Сбросить кэш компьютера: ipconfig /flushdns в Windows.',act:async()=>{reset2();TB('cache').hl=[0];draw();await walk(['phone','R','res'],{label:'api.ridenow.com ?'});mark('res','ok','есть в кэше');draw();await walk(['res','R','phone'],{kind:'resp',label:'104.21.7.44'});mark('phone','ok','за 3 мс');draw();}}],

 idea:['Карточка в справочнике','В справочнике у организации не только телефон: есть адрес, почтовый индекс, «см. также». У домена так же: адрес IPv4, адрес IPv6, псевдоним, почтовый сервер, служебные заметки.','На схеме — зона ridenow.com с её записями и телефон, который их запрашивает.'],

 beats:[
 {say:'Зона домена — это набор <b>записей</b>. Самые частые: <b>A</b> — адрес IPv4, <b>AAAA</b> — адрес IPv6, <b>CNAME</b> — псевдоним («смотри другое имя»), <b>MX</b> — почтовый сервер, <b>TXT</b> — служебный текст.',what:'Показаны записи зоны ridenow.com.',who:'Авторитетный сервер.',ch:'Видно, что хранит домен.',w:['Запись DNS','строка зоны: имя, тип, значение и TTL.'],act:async()=>{tbl('zone',520,20,370,'Зона ridenow.com',[['api','A','104.21.7.44'],['api','AAAA','2606:4700::6815'],['www','CNAME','ridenow.com'],['@','MX','mail.ridenow.com'],['@','TXT','v=spf1 …']],[80,80,210]);actv('ns');draw();await wait(400);}},

 {say:'Поломка первая: резолвер не отвечает. Пакеты в интернет ходят, но имена не превращаются в адреса — «сайт не найден». Проверка: ping 1.1.1.1 работает, а ping ya.ru — нет. Лечение: указать другой DNS-сервер.',what:'Резолвер не ответил.',who:'Телефон и резолвер.',ch:'Видна картина «интернет есть, сайтов нет».',act:async()=>{reset2();draw();await walk(['phone','R','res'],{label:'A api ?'});boom('res');mark('res','bad','не отвечает');mark('phone','bad','сайт не найден');draw();}},
 {say:'Поломка вторая: опечатка в имени — ridenow.co вместо .com. Авторитетный сервер ответит <b>NXDOMAIN</b> — «такого имени нет». Поломка третья: устаревший кэш после переезда сайта. Поломка четвёртая: запись в файле <b>hosts</b> на компьютере перекрывает DNS.',what:'Разобраны типичные поломки.',who:'—',ch:'Есть список того, что проверять.',w:['NXDOMAIN','ответ DNS «такого имени не существует».'],pro:'Файл hosts — локальный справочник, его компьютер читает раньше DNS. Путь: C:\\Windows\\System32\\drivers\\etc\\hosts или /etc/hosts. Им пользуются разработчики и, увы, вирусы.',act:async()=>{reset2();mark('ns','bad','NXDOMAIN: ridenow.co');mark('phone','info','проверь hosts и кэш');draw();await wait(300);}}],
 theory:{sec:[

LS.m7l1={mod:7,t:'Порты и сокеты',goals:['Понять, зачем нужны порты','Запомнить известные номера портов','Разобрать, что такое сокет и соединение'],
